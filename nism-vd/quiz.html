er margin = more cash per contract = less leverage.","x":["Higher margin means lower leverage.","No direct link.","Trading continues; it just needs more cash.",null]},{"id":"c13-025","ch":13,"lvl":"H","q":"An exporter must sell USD 1,37,500 on an exact date that doesn't match exchange contract sizes or expiries. Which product suits best?","o":["Index options","Exchange currency futures","Stock futures","An OTC forward contract with a bank"],"a":3,"why":"Forwards can be customised to the exact amount and date.","x":["An equity index doesn't hedge currency risk.","Standard lots and expiry dates won't match exactly.","Wrong underlying.",null]},{"id":"c13-026","ch":13,"lvl":"S","q":"Which of these is an OTC derivative?","o":["Nifty index futures","An interest rate swap negotiated between two banks","Stock options on NSE","Interest rate futures on NSE"],"a":1,"why":"OTC = negotiated directly between two parties, not on an exchange.","x":["Traded on NSE: exchange-traded.",null,"Exchange-traded.","Exchange-traded."]},{"id":"c13-027","ch":13,"lvl":"S","q":"A hedger uses derivatives to:","o":["Reduce an existing price risk","Take extra risk for profit","Earn riskless profit from price gaps","Increase leverage on a view"],"a":0,"why":"A hedger already has exposure (holds or will hold the asset) and takes an opposite derivative position to cut risk.","x":[null,"That is a speculator.","That is an arbitrageur.","Leverage on a view is speculation."]},{"id":"c13-028","ch":13,"lvl":"S","q":"Which of these is exchange-traded?","o":["A forward contract between an importer and a bank","An interest rate swap between two companies","Stock futures on NSE","A forward rate agreement"],"a":2,"why":"Stock futures are standard contracts traded on NSE/BSE and cleared by the clearing corporation.","x":["Forwards are OTC.","Swaps are mostly OTC.",null,"FRAs are OTC."]},{"id":"c13-029","ch":13,"lvl":"H","q":"Why do forward contracts carry more default risk than futures?","o":["Forwards have no underlying","Forwards are always larger","There is no daily MTM, so losses build up till maturity","Forwards are regulated by SEBI"],"a":2,"why":"With MTM, losses are paid daily and stay small. A forward's loss grows unpaid until the end.","x":["They do have an underlying.","Size is not the reason.",null,"Regulation isn't the reason, and most forwards are OTC."]},{"id":"c13-030","ch":13,"lvl":"H","q":"Which statement about the clearing corporation is NOT true?","o":["It guarantees profits to all traders","It collects margins from members","It runs daily mark-to-market settlement","It acts as counterparty to every trade"],"a":0,"why":"It guarantees settlement of trades, not anyone's profit.","x":[null,"True.","True.","True: novation."]},{"id":"c13-031","ch":13,"lvl":"S","q":"The Settlement Guarantee Fund is maintained by:","o":["The clearing corporation","SEBI","Each stock broker separately","The Ministry of Finance"],"a":0,"why":"The SGF lets the clearing corporation complete settlement even if a member defaults.","x":[null,"SEBI supervises but doesn't keep the SGF.","It's a common fund at the clearing corporation.","Not involved in settlement."]},{"id":"c13-032","ch":13,"lvl":"S","q":"Daily settlement of profits and losses on futures positions is called:","o":["Mark-to-market (MTM)","Novation","Exercise","Rollover"],"a":0,"why":"Each day the position is valued at the settlement price; the gain or loss is paid in cash.","x":[null,"Novation means the clearing corporation becomes the counterparty.","Exercise applies to options.","Rollover means moving a position to the next expiry."]},{"id":"c13-033","ch":13,"lvl":"S","q":"Ignoring costs, trading in derivatives is described as a:","o":["Zero-sum game","Positive-sum game","Wealth-creating activity","Negative-sum game"],"a":0,"why":"One side's gain equals the other side's loss. No new wealth is created by the contract itself.","x":[null,"Derivatives don't create wealth; they transfer risk.","Wealth is only moved between the two sides.","It becomes negative-sum only after costs. The question says ignore costs."]},{"id":"c13-034","ch":13,"lvl":"H","q":"Which risk is NOT removed by trading on an exchange instead of OTC?","o":["Market (price) risk","Risk of non-transparent prices","Counterparty default risk","Settlement risk"],"a":0,"why":"The clearing corporation removes counterparty risk. Your position can still lose if the price moves against you.","x":[null,"Exchange prices are public.","Removed by novation.","Covered by the clearing corporation and SGF."]},{"id":"c13-035","ch":13,"lvl":"H","q":"A share trades at ₹500 on NSE and ₹502 on BSE at the same moment. What does an arbitrageur do?","o":["Wait for prices to equalise","Buy on both exchanges","Buy on NSE and sell on BSE, earning ₹2 per share before costs","Buy on BSE and sell on NSE"],"a":2,"why":"Buy cheap, sell dear, at the same time.","x":["Arbitrage acts now, while the gap exists.","That is a directional bet, not arbitrage.",null,"That locks in a ₹2 loss."]},{"id":"c13-036","ch":13,"lvl":"S","q":"Which participant helps keep prices in different markets in line with each other?","o":["Hedger","Custodian","Arbitrageur","Speculator"],"a":2,"why":"Arbitrageurs buy in the cheap market and sell in the dear market until the gap closes.","x":["Hedgers cut their own risk; they don't target price gaps.","Custodians hold assets; they don't trade.",null,"Speculators bet on direction."]},{"id":"c13-037","ch":13,"lvl":"S","q":"Which committee recommended the regulatory framework for derivatives trading in India?","o":["Narasimham Committee","Kelkar Committee","L.C. Gupta Committee","J.R. Varma Committee"],"a":2,"why":"L.C. Gupta = framework for derivatives trading. J.R. Varma = risk containment (margins).","x":["Narasimham worked on banking sector reforms.","Kelkar worked on tax reforms.",null,"Varma worked on risk containment and margins, not the overall framework."]},{"id":"c13-038","ch":13,"lvl":"S","q":"Physical settlement of a derivative means:","o":["The underlying asset is delivered against payment","Only the price difference is paid","Margins are refunded","The contract is cancelled"],"a":0,"why":"Stock futures and stock options in India are physically settled at expiry.","x":[null,"That is cash settlement.","Margins are released, but delivery is the point.","Settlement completes the contract."]},{"id":"c13-039","ch":13,"lvl":"H","q":"A hedger gains ₹5 lakh on a futures position. Ignoring costs, what happens on the other side?","o":["No one loses because the hedger was hedging","The exchange pays the ₹5 lakh","SEBI pays from the investor protection fund","The counterparties lose ₹5 lakh in total"],"a":3,"why":"Zero-sum: total gains equal total losses.","x":["Purpose doesn't change the zero-sum nature.","The exchange passes cash between members; it doesn't fund profits.","Not how MTM works.",null]},{"id":"c13-040","ch":13,"lvl":"H","q":"An index futures contract trades at 24,800 with a lot size of 75. What is the notional value of one lot?","o":["₹1,86,00,000","₹18,60,000","₹24,800","₹1,86,000"],"a":1,"why":"Notional = price × lot = 24,800 × 75 = ₹18,60,000.","x":["Off by a factor of 10. Check your multiplication.",null,"That is just the index level, not the value of one lot.","Off by a factor of 10. Check your multiplication."]},{"id":"c13-041","ch":13,"lvl":"S","q":"Leverage in derivatives arises because:","o":["The exchange lends money to traders","Premiums are refunded at expiry","A small margin controls a large position","Derivatives have no price risk"],"a":2,"why":"You pay, say, 15% margin but gain or lose on 100% of the contract value.","x":["The exchange lends nothing; margin is a deposit.","Premiums are never refunded.",null,"They have full price risk on the notional value."]},{"id":"c13-042","ch":13,"lvl":"S","q":"An arbitrageur in derivatives markets:","o":["Takes large directional bets","Only buys options","Profits from price differences between markets with little or no risk","Reduces risk on assets they hold"],"a":2,"why":"Buy where cheap, sell where expensive, at the same time. This keeps prices across markets in line.","x":["That is a speculator.","Arbitrage uses any instrument; it is about mispricing.",null,"That is a hedger."]},{"id":"c13-043","ch":13,"lvl":"S","q":"What role does a speculator play in derivatives markets?","o":["Removes price risk from the market","Takes on risk and adds liquidity","Sets the exchange's margin rates","Guarantees settlement of trades"],"a":1,"why":"Speculators take the other side of hedgers' trades. They bear the risk hedgers want to shed and make the market liquid.","x":["Speculators take risk, they don't remove it.",null,"Margins are set by the exchange/clearing corporation.","The clearing corporation guarantees settlement."]},{"id":"c13-044","ch":13,"lvl":"H","q":"A trader has ₹3 lakh. The margin on stock futures is 15%. What is the largest notional position the trader can take?","o":["₹45,000","₹3.45 lakh","₹20 lakh","₹2 lakh"],"a":2,"why":"Position = cash ÷ margin rate = 3,00,000 ÷ 0.15 = ₹20,00,000.","x":["You multiplied by 15%. Divide instead.","Margin isn't added on top. Divide cash by the margin rate.",null,"Off by a factor of 10."]},{"id":"c13-045","ch":13,"lvl":"H","q":"SPAN margin is based on:","o":["The worst likely loss of the whole portfolio under many scenarios","The option premium only","A flat percentage of each contract","The trader's annual income"],"a":0,"why":"SPAN tests price and volatility scenarios and charges the worst one-day loss. It looks at the whole portfolio, so offsetting positions need less margin.","x":[null,"Premium is not the margin basis.","Exposure margin is a flat %, but SPAN is scenario-based.","Income is irrelevant."]},{"id":"c13-046","ch":13,"lvl":"S","q":"Under which law are derivatives included in the definition of 'securities' in India?","o":["Companies Act, 2013","Securities Contracts (Regulation) Act, 1956 (amended 1999)","SEBI Act, 1992","FEMA, 1999"],"a":1,"why":"The 1999 amendment to SCRA added derivatives to the definition of securities. That made exchange trading legal.","x":["The Companies Act governs companies, not the definition of traded derivatives.",null,"The SEBI Act set up SEBI. The definition of securities sits in SCRA.","FEMA covers foreign exchange, not the definition of securities."]},{"id":"c13-047","ch":13,"lvl":"S","q":"In exchange-traded derivatives, counterparty risk is removed because:","o":["Brokers carry no positions","SEBI pays any defaulted amount","The exchange insures every trader's profit","The clearing corporation becomes the counterparty to both sides (novation)"],"a":3,"why":"Novation: the clearing corporation is buyer to every seller and seller to every buyer, so traders don't face each other.","x":["Brokers' positions have nothing to do with counterparty risk.","SEBI regulates; it does not pay defaults.","The guarantee is for settlement, not for profit.",null]},{"id":"c13-048","ch":13,"lvl":"S","q":"A swap is a contract to:","o":["Get the right to buy an asset","Buy an asset at today's price for future delivery","Buy shares on margin","Exchange a series of cash flows between two parties"],"a":3,"why":"Example: interest rate swap — one side pays fixed, the other pays floating, on a notional amount.","x":["That is a call option.","That is a forward.","That is margin trading, not a swap.",null]},{"id":"c13-049","ch":13,"lvl":"H","q":"A company with a floating-rate loan fears rates will rise. Which swap position hedges this?","o":["Pay floating, receive fixed","Pay floating, receive floating","Pay fixed, receive floating","Buy index futures"],"a":2,"why":"The floating receipt from the swap offsets the floating loan payment, leaving a fixed cost.","x":["That adds more floating exposure.","No hedge; it does nothing useful.",null,"Equity futures don't hedge interest rates."]},{"id":"c13-050","ch":13,"lvl":"H","q":"A jeweller must buy gold in 3 months and buys gold futures today. Gold rises 8% by then. What is the net effect?","o":["The jeweller gains 8% overall","The hedge fails because gold rose","The futures gain offsets the higher purchase cost, so the price is roughly locked","The jeweller loses 8% on the futures"],"a":2,"why":"This is a long (buying) hedge. Higher cash price is paid, but the futures profit makes up for it.","x":["The gain is offset by the higher cost of gold. Net ≈ locked price.","A hedge works both ways; the point is to lock the price.",null,"Long futures gain when price rises."]},{"id":"c20-001","ch":20,"lvl":"S","q":"An insurer will invest in bonds in 2 months and fears rates will fall. Which IRF trade hedges this?","o":["Sell interest rate futures","Buy interest rate futures","Buy equity index futures","Sell bonds now"],"a":1,"why":"Rates fall → bond prices rise → long futures gain, offsetting the higher purchase price.","x":["That gains if rates rise — not the risk here.",null,"Wrong underlying.","It has no bonds yet."]},{"id":"c20-002","ch":20,"lvl":"S","q":"Why do physically settled bond futures use a conversion factor?","o":["To convert rupees into dollars","To calculate margin","To make different deliverable bonds comparable with the notional bond","To convert yield into duration"],"a":2,"why":"Each bond in the basket has a different coupon and maturity; CF adjusts for that.","x":["No.","Margin is separate.",null,"No."]},{"id":"c20-003","ch":20,"lvl":"S","q":"The underlying for bond futures traded on Indian exchanges is:","o":["Equity shares","Government of India securities","Bank fixed deposits","Corporate bonds"],"a":1,"why":"Bond futures in India are on GOI securities.","x":["No.",null,"No.","Not the underlying for exchange IRF."]},{"id":"c20-004","ch":20,"lvl":"H","q":"A ₹80,00,00,000 debt fund has modified duration 7 and wants 5. Futures: duration 6.4, contract value ₹2 lakh. What should the fund do?","o":["Buy 1,250 contracts","Sell 3,125 contracts","Sell 8,000 contracts","Sell 1,250 contracts"],"a":3,"why":"N = (target − current) × V ÷ (MDf × Vf) = (5 − 7) × ₹80,00,00,000 ÷ (6.4 × 2,00,000) = -1,250. Positive = buy (adds duration).","x":["Wrong direction. Buying futures adds duration; selling cuts it.","You used the target duration, not the change.","You ignored the futures duration.",null]},{"id":"c20-005","ch":20,"lvl":"H","q":"Futures settlement price 101.10, conversion factor 0.9650, accrued interest 0.85. What invoice price does the long pay (per ₹100 face)?","o":["98.411","97.561","96.712","101.950"],"a":0,"why":"Invoice = F × CF + AI = 101.10 × 0.9650 + 0.85 = 98.411.","x":[null,"You forgot accrued interest.","Accrued interest is added, not subtracted.","You forgot the conversion factor."]},{"id":"c20-006","ch":20,"lvl":"S","q":"Compared with OTC interest rate swaps, exchange-traded IRF are:","o":["Free of margins","Customised to each client","Standardised and guaranteed by a clearing corporation","Unregulated"],"a":2,"why":"Exchange products: standard terms, MTM, central counterparty.","x":["Margins apply.","That's OTC.",null,"Regulated by RBI and SEBI."]},{"id":"c20-007","ch":20,"lvl":"S","q":"A bond has a modified duration of 6. Yields rise by 0.25%. What is the approximate change in price?","o":["-1.50%","+1.50%","-150.00%","-0.25%"],"a":0,"why":"%ΔP ≈ −MD × Δy = −6 × (+0.25) = -1.50%.","x":[null,"Sign reversed. Price moves opposite to yield.","Units: Δy is already in %, don't multiply by 100.","You ignored duration."]},{"id":"c20-008","ch":20,"lvl":"S","q":"PVBP (or DV01) measures:","o":["The change in price for a 1 basis point change in yield","The bond's coupon","Credit rating","Accrued interest"],"a":0,"why":"PVBP = price value of a basis point (0.01%).","x":[null,"No.","No.","No."]},{"id":"c20-009","ch":20,"lvl":"H","q":"A bond priced at 98.5 has modified duration 5.5. Yield falls by 30 bps. What is the approximate new price?","o":["96.87","261.02","100.13","100.15"],"a":2,"why":"ΔP ≈ −MD × Δy × P = −5.5 × -0.0030 × 98.5 = +1.63. New price = 100.13.","x":["Direction reversed. Yield up → price down.","Units error: 50 bps = 0.005, not 0.5.",null,"You treated the % change as a rupee change; multiply by price."]},{"id":"c20-010","ch":20,"lvl":"H","q":"Duration estimates of price change are least accurate for:","o":["Large yield changes","Small yield changes","Zero-coupon bonds only","Short-dated T-bills"],"a":0,"why":"Convexity makes the price curve bend; the straight-line estimate drifts.","x":[null,"Duration works well for small moves.","Accuracy issue is about size of move.","They have low convexity."]},{"id":"c20-011","ch":20,"lvl":"S","q":"Other things equal, a bond with a longer duration:","o":["Changes less in price","Has no interest rate risk","Changes more in price for a given yield change","Never changes in price"],"a":2,"why":"Duration = price sensitivity.","x":["Opposite.","It has more.",null,"No."]},{"id":"c20-012","ch":20,"lvl":"S","q":"The 91-day T-bill futures implies an annualised yield of 6.40%. What is its quoted price?","o":["98.40","93.60","6.40","106.40"],"a":1,"why":"Quote = 100 − yield = 100 − 6.40 = 93.60.","x":["Don't de-annualise the yield in the quote.",null,"The quote isn't the yield itself.","Wrong sign. Subtract the yield."]},{"id":"c20-013","ch":20,"lvl":"S","q":"Which is a key advantage of hedging a bond portfolio with IRF instead of selling bonds?","o":["It removes all risk","Lower cost and speed; the bonds are kept","It increases yield","No margin is needed"],"a":1,"why":"Futures are liquid and cheap to trade; the fund keeps its holdings.","x":["Basis risk remains.",null,"Hedging doesn't raise yield.","Margin is needed."]},{"id":"c20-014","ch":20,"lvl":"H","q":"A portfolio's PVBP is ₹4,00,000. One bond futures contract has a PVBP of ₹160. How many contracts hedge the portfolio?","o":["Sell 2,500","Sell 25","Sell 25,000","Buy 2,500"],"a":0,"why":"N = PVBP portfolio ÷ PVBP futures = ₹4,00,000 ÷ 160 = 2,500. Sell to hedge a long bond position.","x":[null,"Off by 100.","Off by 10.","Direction reversed."]},{"id":"c20-015","ch":20,"lvl":"H","q":"A bank has a fixed-rate bond portfolio funded by floating-rate deposits. Rates are expected to rise. Which combination hedges?","o":["Buy a cap on deposits only","Buy IRF or receive fixed in an IRS","Sell IRF or pay fixed in an IRS","Buy more fixed-rate bonds"],"a":2,"why":"Both gain when rates rise.","x":["Not the standard answer here; and it's one-sided.","Both gain when rates fall.",null,"More exposure."]},{"id":"c20-016","ch":20,"lvl":"S","q":"A trader sold 50 bond futures contracts at 99.80 and closed them at 99.20. Contract size is ₹2 lakh face value. What is the profit or loss?","o":["Profit of ₹1,200","Loss of ₹60,000","Profit of ₹60,000","Profit of ₹30"],"a":2,"why":"Per contract: 0.60% of ₹2,00,000 = ₹1,200. × 50 = ₹60,000. Short gains as price falls.","x":["That's one contract.","Direction reversed.",null,"You didn't scale by contract size."]},{"id":"c20-017","ch":20,"lvl":"S","q":"A debt mutual fund mainly uses IRF to:","o":["Manage portfolio duration and hedge interest rate risk","Avoid NAV calculation","Increase equity exposure","Pay dividends"],"a":0,"why":"Selling IRF cuts duration; buying adds duration — without selling bonds.","x":[null,"No.","IRF is a rate product.","No."]},{"id":"c20-018","ch":20,"lvl":"S","q":"A long position in bond futures profits when:","o":["Interest rates rise","Interest rates fall","Inflation rises","Equity markets rise"],"a":1,"why":"Rates down → bond prices up → long gains.","x":["That hurts the long.",null,"Higher inflation usually lifts yields — bad for longs.","Wrong underlying."]},{"id":"c20-019","ch":20,"lvl":"H","q":"A ₹1,00,00,00,000 bond portfolio has modified duration 5. Bond futures trade at 100 (contract ₹2 lakh face), futures duration 7. How many contracts hedge the portfolio fully?","o":["Sell about 3,571","Sell about 5,000","Sell about 7,000","Buy about 3,571"],"a":0,"why":"Contract value = 100% × 2,00,000 = ₹2,00,000. N = (MDp × Vp) ÷ (MDf × Vf) = (5 × ₹1,00,00,00,000) ÷ (7 × ₹2,00,000) ≈ 3,571. Sell to hedge.","x":[null,"You ignored the duration ratio.","You flipped the duration ratio.","Direction reversed. A long bond holder sells futures."]},{"id":"c20-020","ch":20,"lvl":"H","q":"Futures settlement price 98.50, conversion factor 1.0320, accrued interest 1.20. What invoice price does the long pay (per ₹100 face)?","o":["102.852","99.700","101.652","100.452"],"a":0,"why":"Invoice = F × CF + AI = 98.50 × 1.0320 + 1.20 = 102.852.","x":[null,"You forgot the conversion factor.","You forgot accrued interest.","Accrued interest is added, not subtracted."]},{"id":"c20-021","ch":20,"lvl":"S","q":"Modified duration tells you:","o":["The coupon rate","The time to next coupon","The bond's maturity in years","The approximate % change in price for a 1% change in yield"],"a":3,"why":"%ΔP ≈ −MD × Δy.","x":["No.","No.","That's maturity, not modified duration.",null]},{"id":"c20-022","ch":20,"lvl":"S","q":"Gross basis in bond futures is:","o":["Cash bond price − (futures price × conversion factor)","Accrued interest × CF","Futures price − spot price","Coupon − yield"],"a":0,"why":"This measures how expensive a bond is to deliver. The CTD has the lowest net cost.","x":[null,"No.","For bond futures, the CF adjustment is needed.","No."]},{"id":"c20-023","ch":20,"lvl":"S","q":"The underlying for T-bill futures in India is:","o":["Commercial paper","Call money","The 10-year G-sec","The 91-day Treasury bill"],"a":3,"why":"Exchange T-bill futures are on the 91-day T-bill.","x":["No.","No.","That's for bond futures.",null]},{"id":"c20-024","ch":20,"lvl":"H","q":"A bond priced at 102 has modified duration 7.2. Yield rises by 50 bps. What is the approximate new price?","o":["-265.20","98.33","105.67","98.40"],"a":1,"why":"ΔP ≈ −MD × Δy × P = −7.2 × +0.0050 × 102 = -3.67. New price = 98.33.","x":["Units error: 50 bps = 0.005, not 0.5.",null,"Direction reversed. Yield up → price down.","You treated the % change as a rupee change; multiply by price."]},{"id":"c20-025","ch":20,"lvl":"H","q":"A trader expects the yield curve to flatten. The futures trade is:","o":["Sell short-tenor futures and buy long-tenor futures","Sell equity futures","Buy T-bill futures only","Buy short-tenor, sell long-tenor"],"a":0,"why":"Flattening: short yields up relative to long yields.","x":[null,"Wrong market.","Single leg is directional.","That's a steepener."]},{"id":"c20-026","ch":20,"lvl":"S","q":"The 91-day T-bill futures implies an annualised yield of 7.15%. What is its quoted price?","o":["92.85","107.15","7.15","98.21"],"a":0,"why":"Quote = 100 − yield = 100 − 7.15 = 92.85.","x":[null,"Wrong sign. Subtract the yield.","The quote isn't the yield itself.","Don't de-annualise the yield in the quote."]},{"id":"c20-027","ch":20,"lvl":"S","q":"Invoice price paid by the long when a bond is delivered equals:","o":["Bond's market price","Futures price only","Futures price − accrued interest","Futures settlement price × conversion factor + accrued interest"],"a":3,"why":"The long pays the futures price adjusted for the bond, plus interest accrued.","x":["Delivery is at the futures-based invoice.","Ignores CF and accrued interest.","Accrued interest is added.",null]},{"id":"c20-028","ch":20,"lvl":"S","q":"'Cheapest to deliver' (CTD) means:","o":["The bond in the deliverable basket that costs the short least to deliver","The bond the buyer prefers","The cheapest T-bill","The bond with the lowest coupon always"],"a":0,"why":"The short chooses the bond; it picks the cheapest one.","x":[null,"The short chooses.","CTD applies to bond futures.","Coupon alone doesn't decide; price and conversion factor do."]},{"id":"c20-029","ch":20,"lvl":"H","q":"The CTD bond is the one with:","o":["The lowest implied repo rate","The longest maturity always","The highest implied repo rate","The highest coupon always"],"a":2,"why":"Buying the CTD and delivering it into futures gives the best return.","x":["That's the most expensive to deliver.","Not always.",null,"Not always."]},{"id":"c20-030","ch":20,"lvl":"H","q":"A treasurer expects short-term rates to rise. Which T-bill futures trade fits?","o":["Do nothing","Sell T-bill futures","Buy long-dated bonds","Buy T-bill futures"],"a":1,"why":"Quote = 100 − yield. Yield up → quote down → short gains.","x":["Leaves the view unused.",null,"More rate risk.","That gains if rates fall."]},{"id":"c20-031","ch":20,"lvl":"S","q":"Who can trade exchange-traded interest rate futures in India?","o":["Only banks","All of these: banks, primary dealers, mutual funds, FPIs and retail investors","Only foreign investors","Only RBI"],"a":1,"why":"IRF is open to a wide range of participants.","x":["Too narrow.",null,"Too narrow.","RBI regulates; it doesn't trade for profit."]},{"id":"c20-032","ch":20,"lvl":"S","q":"A bond has a modified duration of 4.5. Yields fall by 0.40%. What is the approximate change in price?","o":["-1.80%","+0.40%","+1.80%","+180.00%"],"a":2,"why":"%ΔP ≈ −MD × Δy = −4.5 × (-0.40) = +1.80%.","x":["Sign reversed. Price moves opposite to yield.","You ignored duration.",null,"Units: Δy is already in %, don't multiply by 100."]},{"id":"c20-033","ch":20,"lvl":"S","q":"Bond prices and yields move:","o":["Independently","Only when RBI changes repo","In the same direction","In opposite directions"],"a":3,"why":"Higher yield = future cash flows discounted more = lower price.","x":["They are mathematically linked.","They move every day in the market.","Opposite.",null]},{"id":"c20-034","ch":20,"lvl":"H","q":"A ₹2,00,00,00,000 debt fund has modified duration 4 and wants 6. Futures: duration 8, contract value ₹2 lakh. What should the fund do?","o":["Buy 2,500 contracts","Buy 7,500 contracts","Buy 20,000 contracts","Sell 2,500 contracts"],"a":0,"why":"N = (target − current) × V ÷ (MDf × Vf) = (6 − 4) × ₹2,00,00,00,000 ÷ (8 × 2,00,000) = +2,500. Positive = buy (adds duration).","x":[null,"You used the target duration, not the change.","You ignored the futures duration.","Wrong direction. Buying futures adds duration; selling cuts it."]},{"id":"c20-035","ch":20,"lvl":"H","q":"A bond hedge with IRF is not perfect mainly because of:","o":["Basis risk between the portfolio's bonds and the futures underlying","Clearing corporation guarantee","Daily MTM","High liquidity"],"a":0,"why":"Different bonds don't move exactly together.","x":[null,"That removes counterparty risk.","MTM doesn't make a hedge imperfect.","Liquidity helps hedging."]},{"id":"c20-036","ch":20,"lvl":"S","q":"A bank holding G-secs fears interest rates will rise. Which IRF trade hedges the risk?","o":["Buy more G-secs","Buy interest rate futures","Sell interest rate futures","Do nothing"],"a":2,"why":"Rates up → bond and futures prices fall → short futures gain.","x":["More exposure.","That adds to the loss if rates rise.",null,"That leaves the risk open."]},{"id":"c20-037","ch":20,"lvl":"S","q":"If interest rates rise, a short position in interest rate futures will:","o":["Not change","Gain","Be cancelled","Lose"],"a":1,"why":"Rates up → futures price down → short gains.","x":["IRF prices react to rates.",null,"No.","That's a long position."]},{"id":"c20-038","ch":20,"lvl":"S","q":"Exchange-traded interest rate derivatives in India are regulated by:","o":["Only RBI","IRDAI","RBI and SEBI jointly","Only SEBI"],"a":2,"why":"RBI sets the rules for interest rate products; SEBI regulates the exchange.","x":["SEBI regulates exchanges.","Insurance regulator.",null,"RBI also has a role."]},{"id":"c20-039","ch":20,"lvl":"H","q":"A portfolio's PVBP is ₹2,50,000. One bond futures contract has a PVBP of ₹125. How many contracts hedge the portfolio?","o":["Sell 2,000","Sell 20","Buy 2,000","Sell 20,000"],"a":0,"why":"N = PVBP portfolio ÷ PVBP futures = ₹2,50,000 ÷ 125 = 2,000. Sell to hedge a long bond position.","x":[null,"Off by 100.","Direction reversed.","Off by 10."]},{"id":"c20-040","ch":20,"lvl":"H","q":"Interest rate options on bonds: a CALL option gains when:","o":["Inflation rises","Equity markets rise","Interest rates rise","Interest rates fall (bond prices rise)"],"a":3,"why":"Option on a bond price: call gains when price rises, i.e. when rates fall.","x":["Usually lifts yields — bad for calls on bonds.","Wrong market.","That's when a put on bond price gains.",null]},{"id":"c20-041","ch":20,"lvl":"S","q":"T-bill futures are quoted as:","o":["100 plus the yield","The yield itself","100 minus the annualised discount yield","Face value of the T-bill"],"a":2,"why":"Quote = 100 − yield. Yield up → quote down, like a price.","x":["Wrong sign.","Quoting as 100 − yield makes the quote move like a price.",null,"No."]},{"id":"c20-042","ch":20,"lvl":"S","q":"A trader bought 30 bond futures contracts at 101.25 and closed them at 101.70. Contract size is ₹2 lakh face value. What is the profit or loss?","o":["Profit of ₹27,000","Profit of ₹900","Loss of ₹27,000","Profit of ₹14"],"a":0,"why":"Per contract: 0.45% of ₹2,00,000 = ₹900. × 30 = ₹27,000. Long gains as price rises.","x":[null,"That's one contract.","Direction reversed.","You didn't scale by contract size."]},{"id":"c20-043","ch":20,"lvl":"S","q":"A bond position has face value ₹1 crore, price 100 and modified duration 8. What is its PVBP?","o":["₹8,000","₹800","₹80,000","₹8,00,000"],"a":0,"why":"PVBP = MD × value × 0.0001 = 8 × 1,00,00,000 × 0.0001 = ₹8,000.","x":[null,"Off by a factor of 10.","That's 10 bps, not 1 bp.","That's 1%, i.e. 100 bps."]},{"id":"c20-044","ch":20,"lvl":"H","q":"A fund manager wants to cut duration quickly without selling bonds. The best tool is to:","o":["Buy equity futures","Sell interest rate futures","Buy long-dated G-secs","Buy interest rate futures"],"a":1,"why":"Short futures carry negative duration, lowering portfolio duration.","x":["Wrong market.",null,"Adds duration.","That adds duration."]},{"id":"c20-045","ch":20,"lvl":"H","q":"For the same size of yield change, a plain bond's price rises more than it falls. This is due to:","o":["Credit risk","Negative duration","Positive convexity","Accrued interest"],"a":2,"why":"Duration gives a straight-line estimate; convexity adds the curve.","x":["Unrelated.","Duration is positive.",null,"Unrelated."]},{"id":"c20-046","ch":20,"lvl":"S","q":"A deliverable bond has a coupon higher than the notional coupon. Its conversion factor is:","o":["Zero","Exactly 1","Less than 1","Greater than 1"],"a":3,"why":"Higher coupon = worth more than the notional bond at the notional yield.","x":["No.","Only if coupon equals notional.","That's for coupon below notional.",null]},{"id":"c20-047","ch":20,"lvl":"S","q":"In a physically settled bond futures contract, the choice of which bond to deliver belongs to:","o":["The exchange","The seller (short)","The buyer (long)","RBI"],"a":1,"why":"The delivery option is with the short.","x":["The exchange sets the basket only.",null,"The long accepts what's delivered.","No."]},{"id":"c20-048","ch":20,"lvl":"H","q":"A trader expects the yield curve to steepen (long yields rise more than short yields). Using futures, the trader should:","o":["Sell short-tenor and buy long-tenor futures","Buy both","Buy short-tenor futures and sell long-tenor futures","Sell both"],"a":2,"why":"Long yields up → long-tenor futures fall (short gains). Short tenor relatively firmer.","x":["That's a flattening trade.","Directional, not a curve trade.",null,"Directional, not a curve trade."]},{"id":"c20-049","ch":20,"lvl":"H","q":"Futures price 99.00. Bond A: price 104.00, CF 1.0500. Bond B: price 99.00, CF 0.9950. Which is cheapest to deliver?","o":["Both equal","Bond B, because its price is lower","Bond A (cost 0.05)","Bond B (cost 0.05)"],"a":2,"why":"Delivery cost = price − F × CF. A: 104.00 − 103.95 = 0.05. B: 99.00 − 98.505 = 0.495. Lowest = A.","x":["They differ.","Price alone is misleading; adjust by CF.",null,"Recheck: B's cost is 0.495."]},{"id":"c20-050","ch":20,"lvl":"H","q":"When does cash-and-carry arbitrage in bond futures make sense?","o":["Never","When implied repo is below actual repo","When yields are falling","When the implied repo rate is higher than the actual repo (borrowing) rate"],"a":3,"why":"Buy the bond with borrowed money, sell futures, deliver: earn implied repo, pay actual repo.","x":["It's a standard trade.","Then reverse cash-and-carry is better.","Direction doesn't matter for arbitrage.",null]},{"id":"c20-051","ch":20,"lvl":"H","q":"A ₹50,00,00,000 bond portfolio has modified duration 6. Bond futures trade at 98 (contract ₹2 lakh face), futures duration 7.5. How many contracts hedge the portfolio fully?","o":["Buy about 2,041","Sell about 3,189","Sell about 2,551","Sell about 2,041"],"a":3,"why":"Contract value = 98% × 2,00,000 = ₹1,96,000. N = (MDp × Vp) ÷ (MDf × Vf) = (6 × ₹50,00,00,000) ÷ (7.5 × ₹1,96,000) ≈ 2,041. Sell to hedge.","x":["Direction reversed. A long bond holder sells futures.","You flipped the duration ratio.","You ignored the duration ratio.",null]}]};

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s/60), r = s%60; return m + ":" + String(r).padStart(2,"0"); };
const byCh = {}; BANK.questions.forEach(q => (byCh[q.ch] = byCh[q.ch] || []).push(q));
const qById = Object.fromEntries(BANK.questions.map(q => [q.id, q]));

/* ---------- storage: db (record Claude can read) + localStorage (resume on this device) ---------- */
let db = null, dbReady = false;
const LS = BANK.storageKey;
function lsGet(){ try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch(e){ return {}; } }
function lsPut(all){ try { localStorage.setItem(LS, JSON.stringify(all)); } catch(e){} }
let attempts = lsGet();
let saveChain = Promise.resolve();
function persist(att, patch){
  attempts[att.id] = att; lsPut(attempts);
  if (!db) return;
  const ref = db.collection("attempts").doc(att.id);
  saveChain = saveChain.then(() => (patch ? ref.update(patch) : ref.set(att))).then(() => setSaved("Saved"), () => setSaved("Saved on this device only"));
}
function setSaved(t){ const el = $("#saved"); if (el) el.textContent = t; }
(async () => {
  try {
    const d = window.claude && await window.claude.use("db");
    if (!d) return;
    db = d;
    const snap = await db.collection("attempts").get();
    snap.docs.forEach(doc => { const a = doc.data(); if (a && a.id && (!attempts[a.id] || (a.updated||0) >= (attempts[a.id].updated||0))) attempts[a.id] = JSON.parse(JSON.stringify(a)); });
    lsPut(attempts); dbReady = true;
    if (state.view === "home") renderHome();
  } catch(e) { /* page works without db */ }
})();

/* ---------- helpers ---------- */
const state = { view: "home", att: null, queue: [], idx: 0, qStart: 0, qAcc: 0, hidden: false, tick: null, answered: false, lastSec: 0 };
const chInfo = ch => BANK.chapters.find(c => c.ch === ch);
function latest(ch, status){
  return Object.values(attempts).filter(a => a.ch === ch && (!status || a.status === status)).sort((a,b) => (b.started||0) - (a.started||0))[0];
}
function pending(att){ return att.qids.filter(id => !att.answers[id]); }
function skippedIds(att){ return att.qids.filter(id => !att.answers[id] && att.skipped && att.skipped[id]); }
function stats(att){
  const ans = Object.values(att.answers || {});
  const n = ans.length, ok = ans.filter(a => a.ok).length;
  const sec = ans.reduce((t,a) => t + (a.sec||0), 0);
  const lv = l => { const x = ans.filter(a => a.lvl === l); return { n: x.length, ok: x.filter(a => a.ok).length, sec: x.reduce((t,a)=>t+(a.sec||0),0) }; };
  return { n, ok, wrong: n - ok, sec, S: lv("S"), H: lv("H"), neg: ok - 0.1*(n-ok), skipped: skippedIds(att).length, left: pending(att).length };
}

/* ---------- home ---------- */
function renderHome(){
  state.view = "home"; stopTick();
  const cards = BANK.chapters.map((c, i) => {
    const act = latest(c.ch, "active"), done = latest(c.ch, "done");
    const cur = act || done;
    const s = cur && stats(cur);
    const doneSk = done && !act ? skippedIds(done).length : 0;
    const pctA = cur ? s.n / c.n * 100 : 0, pctS = cur ? s.skipped / c.n * 100 : 0;
    let line = "Not started.";
    if (act) line = `In progress: ${s.n}/${c.n} answered, ${s.ok} correct${s.skipped ? `, <b>${s.skipped} skipped</b>` : ""}, ${fmt(s.sec)} used.`;
    else if (done) line = `Finished: ${s.ok}/${s.n} correct (${Math.round(s.ok/Math.max(1,s.n)*100)}%) in ${fmt(s.sec)}${doneSk ? `, <b>${doneSk} skipped still open</b>` : ""}.`;
    const btns = [];
    if (act) { btns.push(`<button class="btn" data-resume="${act.id}">Resume</button>`); if (s.skipped) btns.push(`<button class="btn warn" data-skips="${act.id}">Answer ${s.skipped} skipped</button>`); btns.push(`<button class="btn ghost" data-start="${c.ch}">Restart</button>`); }
    else { if (doneSk) btns.push(`<button class="btn warn" data-skips="${done.id}">Answer ${doneSk} skipped</button>`); btns.push(`<button class="btn ${doneSk ? "ghost" : ""}" data-start="${c.ch}">${done ? "Try again" : "Start"}</button>`); }
    if (done) btns.push(`<button class="btn ghost" data-sum="${done.id}">Last result</button>`);
    return `<div class="card">
      <div>
        <h2><span class="rank">${i+1}</span>Ch ${c.ch} · ${esc(c.name)}</h2>
        <div class="chips"><span class="chip mk">${esc(String(c.marks))} exam marks</span><span class="chip">${c.n} questions</span><span class="chip">${c.s} exam-level · ${c.h} harder</span></div>
        <p class="sub">${line}</p>
      </div>
      <div class="acts">${btns.join("")}</div>
      <div class="bar"><i style="width:${pctA}%"></i><b style="width:${pctS}%"></b></div>
    </div>`;
  }).join("");
  $("#view").innerHTML = `<div class="note"><b>How it works:</b> pick a chapter. Click an option to see right/wrong and the reason at once, or press <b>Skip</b> to come back later. When you end a chapter, you can answer the skipped ones then or keep them for later — the chapter card keeps an <b>Answer skipped</b> button until you do. Timer runs per question and pauses when you leave the tab. Exam pace: <b>${EXAM_PACE} s per question</b>. Keys: A–D answer · S skip · Enter next.</div>
  <div class="cards">${cards}</div>
  <p class="saved">${db ? (dbReady ? "Your answers are saved to this page's record, so Claude can review them later." : "Connecting to the page's record…") : "Answers are saved on this device. Open this page signed in to claude.ai to save them where Claude can review them."}</p>`;
  const v = $("#view");
  v.querySelectorAll("[data-start]").forEach(b => b.onclick = () => startChapter(+b.dataset.start));
  v.querySelectorAll("[data-resume]").forEach(b => b.onclick = () => resume(attempts[b.dataset.resume]));
  v.querySelectorAll("[data-skips]").forEach(b => b.onclick = () => answerSkipped(attempts[b.dataset.skips]));
  v.querySelectorAll("[data-sum]").forEach(b => b.onclick = () => renderSummary(attempts[b.dataset.sum]));
  window.scrollTo(0,0);
}

/* ---------- quiz flow ---------- */
function startChapter(ch, onlyIds){
  const old = latest(ch, "active");
  if (old) { old.status = "abandoned"; old.updated = Date.now(); persist(old, { status: "abandoned", updated: old.updated }); }
  const ids = onlyIds || byCh[ch].map(q => q.id);
  const att = { id: `ch${ch}-${Date.now()}`, ch, started: Date.now(), updated: Date.now(), status: "active", mode: onlyIds ? "retry-wrong" : "full", qids: ids, answers: {}, skipped: {} };
  persist(att);
  state.att = att; state.queue = ids.slice(); state.idx = 0; state.qmode = "main"; openQuestion();
}
function resume(att){
  att.skipped = att.skipped || {};
  state.att = att; state.qmode = "main";
  state.queue = att.qids.slice();
  // continue from the first question never answered or skipped
  const i = att.qids.findIndex(id => !att.answers[id] && !att.skipped[id]);
  if (i < 0) { endScreen(); return; }
  state.idx = i; openQuestion();
}
function answerSkipped(att){
  att.skipped = att.skipped || {};
  const ids = skippedIds(att);
  if (!ids.length) { renderSummary(att); return; }
  state.reopened = att.status === "done";
  if (att.status === "done") { att.status = "active"; att.updated = Date.now(); persist(att, { status: "active", updated: att.updated }); }
  state.att = att; state.queue = ids; state.idx = 0; state.qmode = "skipped"; openQuestion();
}
function elapsedQ(){ return state.qAcc + (state.hidden ? 0 : (performance.now() - state.qStart)/1000); }
function startTick(){ stopTick(); state.tick = setInterval(updClock, 500); }
function stopTick(){ if (state.tick) clearInterval(state.tick); state.tick = null; }
document.addEventListener("visibilitychange", () => {
  if (state.view !== "q" || state.answered) return;
  if (document.hidden) { state.qAcc += (performance.now() - state.qStart)/1000; state.hidden = true; }
  else { state.qStart = performance.now(); state.hidden = false; }
});
function updClock(){
  if (state.view !== "q") return;
  const s = stats(state.att);
  const q = state.answered ? state.lastSec : elapsedQ();
  const qe = $("#qclock"), ce = $("#cclock");
  if (qe) { qe.textContent = fmt(q); qe.style.color = q > EXAM_PACE ? "var(--bad)" : ""; }
  if (ce) ce.textContent = fmt(s.sec + (state.answered ? 0 : q));
}
function openQuestion(){
  state.view = "q";
  const att = state.att, id = state.queue[state.idx], q = qById[id];
  const prev = att.answers[id];
  state.answered = !!prev; state.lastSec = prev ? prev.sec : 0;
  state.qStart = performance.now(); state.qAcc = 0; state.hidden = document.hidden;
  const s = stats(att), total = state.queue.length, ch = chInfo(att.ch);
  const wasSkipped = !prev && att.skipped && att.skipped[id];
  $("#view").innerHTML = `
    <div class="status">
      <span><b>Ch ${att.ch}</b> ${esc(ch.name)}${state.qmode === "skipped" ? " · skipped questions" : att.mode === "retry-wrong" ? " · retry wrong" : ""}</span>
      <span>Q <b>${state.idx+1}/${total}</b></span>
      <span>Score <b id="score">${s.ok}/${s.n}</b></span>
      <span>Skipped <b id="skc">${s.skipped}</b></span>
      <span class="sp"></span>
      <span>This Q <b id="qclock">0:00</b></span>
      <span>Total <b id="cclock">0:00</b></span>
    </div>
    <div class="prog"><i id="progbar" style="width:${s.n/att.qids.length*100}%"></i></div>
    <div class="qcard">
      <div class="chips"><span class="chip ${q.lvl === "H" ? "mk" : ""}">${q.lvl === "H" ? "Harder" : "Exam level"}</span><span class="chip">${q.id}</span>${wasSkipped ? `<span class="chip sk">skipped earlier</span>` : ""}</div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="opts" role="group" aria-label="Options">
        ${q.o.map((t,i) => `<button class="opt" id="opt-${i}" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(t)}</span></button>`).join("")}
      </div>
      <div id="verdict"></div>
    </div>
    <div class="qnav">
      <div>
        <button class="btn ghost" id="prevQ" ${state.idx === 0 ? "disabled" : ""}>← Previous</button>
        <button class="btn ghost" id="endCh">End chapter</button>
      </div>
      <div>
        <button class="btn ghost" id="skipQ" ${prev ? "hidden" : ""}>Skip for now</button>
        <button class="btn" id="nextQ" ${prev ? "" : "hidden"}>${state.idx === total-1 ? "Finish" : "Next →"}</button>
      </div>
    </div>
    <p class="saved" id="saved"></p>`;
  $("#view").querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.i));
  $("#prevQ").onclick = () => { if (state.idx > 0) { state.idx--; openQuestion(); } };
  $("#nextQ").onclick = next;
  $("#skipQ").onclick = skip;
  $("#endCh").onclick = endScreen;
  if (prev) showVerdict(q, prev.c);
  updClock(); startTick();
  window.scrollTo(0,0);
}
function answer(i){
  if (state.answered) return;
  const att = state.att, id = state.queue[state.idx], q = qById[id];
  const sec = Math.round(elapsedQ()*10)/10;
  const wasSkipped = !!(att.skipped && att.skipped[id]);
  state.answered = true; state.lastSec = sec;
  const rec = { c: i, ok: i === q.a, sec, lvl: q.lvl, at: Date.now(), afterSkip: wasSkipped };
  att.answers[id] = rec; att.updated = Date.now();
  const patch = { answers: { [id]: rec }, updated: att.updated };
  if (wasSkipped) { att.skipped[id] = false; patch.skipped = { [id]: false }; }
  if (att.status === "done" && att.result) { const s2 = stats(att); att.result = resultOf(att, s2); patch.result = att.result; }
  persist(att, patch);
  showVerdict(q, i);
  $("#skipQ").hidden = true; const nb = $("#nextQ"); nb.hidden = false; nb.focus();
  const s = stats(att);
  $("#score").textContent = `${s.ok}/${s.n}`; $("#skc").textContent = s.skipped;
  $("#progbar").style.width = (s.n/att.qids.length*100) + "%";
  updClock();
}
function skip(){
  if (state.answered) return;
  const att = state.att, id = state.queue[state.idx];
  att.skipped = att.skipped || {};
  if (!att.skipped[id]) {
    att.skipped[id] = true; att.updated = Date.now();
    persist(att, { skipped: { [id]: true }, updated: att.updated });
  }
  next();
}
function showVerdict(q, i){
  const ok = i === q.a;
  $("#view").querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; if (j === q.a) b.classList.add("right"); else if (j === i) b.classList.add("wrong"); });
  const others = q.o.map((t,j) => ({t,j})).filter(o => o.j !== q.a && o.j !== i);
  $("#verdict").innerHTML = `<div class="verdict">
    <div class="head ${ok ? "ok" : "bad"}">${ok ? "Correct" : "Wrong"} · ${fmt(state.lastSec)}${state.lastSec > EXAM_PACE ? " (slower than exam pace)" : ""}</div>
    <div class="vrow"><span>Answer</span><span><b>${"ABCD"[q.a]}.</b> ${esc(q.o[q.a])}</span></div>
    <div class="vrow"><span>Why</span><span>${esc(q.why)}</span></div>
    ${ok ? "" : `<div class="vrow"><span>Your choice</span><span><b>${"ABCD"[i]}.</b> ${esc(q.o[i])} — ${esc(q.x[i] || "")}</span></div>`}
    <div class="vrow"><span>Other options</span><ul class="others">${others.map(o => `<li><b>${"ABCD"[o.j]}.</b> ${esc(q.x[o.j] || "")}</li>`).join("")}</ul></div>
  </div>`;
}
function next(){
  if (state.idx < state.queue.length - 1) { state.idx++; openQuestion(); }
  else if (state.qmode === "skipped" && state.reopened) finish();
  else endScreen();
}
document.addEventListener("keydown", e => {
  if (state.view !== "q" || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toUpperCase();
  if (k.length === 1 && "ABCD".includes(k) && !state.answered) answer("ABCD".indexOf(k));
  else if (k === "S" && !state.answered) skip();
  else if ((e.key === "Enter" || e.key === "ArrowRight") && state.answered && document.activeElement?.id !== "endCh") { e.preventDefault(); next(); }
});

/* ---------- end screen: offer skipped questions before finishing ---------- */
function endScreen(){
  stopTick(); state.view = "end";
  const att = state.att, sk = skippedIds(att), left = pending(att).filter(id => !sk.includes(id));
  if (!sk.length && !left.length) { finish(); return; }
  $("#view").innerHTML = `<div class="panel">
    <h2>Before you finish Ch ${att.ch}</h2>
    ${sk.length ? `<p>You skipped <b>${sk.length}</b> question${sk.length>1?"s":""}. Answer them now, or finish and keep them for later — the chapter card will show an <b>Answer skipped</b> button.</p>
      <ol>${sk.map(id => `<li>${esc(qById[id].q)}</li>`).join("")}</ol>` : ""}
    ${left.length ? `<p><b>${left.length}</b> question${left.length>1?"s":""} not yet seen. They will also stay open.</p>` : ""}
    <div class="qnav">
      <div>${sk.length ? `<button class="btn warn" id="doSk">Answer ${sk.length} skipped now</button>` : ""}${left.length ? `<button class="btn ghost" id="doLeft">Continue unseen questions</button>` : ""}</div>
      <div><button class="btn" id="doFin">Finish — see feedback</button></div>
    </div></div>`;
  if (sk.length) $("#doSk").onclick = () => answerSkipped(att);
  if (left.length) $("#doLeft").onclick = () => { state.queue = left; state.idx = 0; state.qmode = "main"; openQuestion(); };
  $("#doFin").onclick = () => finish();
  window.scrollTo(0,0);
}
function resultOf(att, s){
  return { answered: s.n, correct: s.ok, wrong: s.wrong, skippedOpen: s.skipped, unseen: s.left - s.skipped, totalSec: Math.round(s.sec), negScore: Math.round(s.neg*10)/10,
    examLevel: { n: s.S.n, correct: s.S.ok }, harder: { n: s.H.n, correct: s.H.ok } };
}
function finish(){
  stopTick();
  const att = state.att, s = stats(att);
  att.status = "done"; att.finished = Date.now(); att.updated = att.finished;
  att.result = resultOf(att, s);
  persist(att, { status: "done", finished: att.finished, updated: att.updated, result: att.result });
  renderSummary(att);
}

/* ---------- summary ---------- */
function renderSummary(att){
  state.view = "sum"; stopTick();
  const s = stats(att), ch = chInfo(att.ch);
  const acc = s.n ? s.ok/s.n : 0, avg = s.n ? s.sec/s.n : 0;
  const expected = Math.round(acc * (parseFloat(ch.marks) || 0) * 10)/10;
  const wrongIds = att.qids.filter(id => att.answers[id] && !att.answers[id].ok);
  const sk = skippedIds(att);
  const slow = att.qids.filter(id => att.answers[id]).map(id => ({id, ...att.answers[id]})).sort((a,b) => b.sec - a.sec).slice(0,5);
  const pctL = l => s[l].n ? Math.round(s[l].ok/s[l].n*100) + "%" : "–";
  const afterSkip = att.qids.filter(id => att.answers[id] && att.answers[id].afterSkip);
  $("#view").innerHTML = `
    <section style="margin-top:18px">
      <p class="lvl">Result · Ch ${att.ch} ${esc(ch.name)}${att.mode === "retry-wrong" ? " · retry wrong" : ""}</p>
      <h2>${s.ok}/${s.n} correct · ${Math.round(acc*100)}%${sk.length ? ` · ${sk.length} skipped open` : ""}</h2>
      <div class="tiles">
        <div class="tile ${acc>=0.6?"good":"poor"}"><b>${Math.round(acc*100)}%</b><span>accuracy on answered (pass = 60%)</span></div>
        <div class="tile"><b>${(Math.round(s.neg*10)/10).toFixed(1)}</b><span>score with −0.1 per wrong</span></div>
        <div class="tile"><b>${fmt(s.sec)}</b><span>total time</span></div>
        <div class="tile ${avg<=EXAM_PACE?"good":"poor"}"><b>${Math.round(avg)} s</b><span>per question (exam: ${EXAM_PACE} s)</span></div>
        <div class="tile skip"><b>${sk.length}</b><span>skipped, still open</span></div>
        <div class="tile"><b>≈ ${expected} / ${esc(String(ch.marks))}</b><span>marks this chapter at this accuracy</span></div>
      </div>
      <div class="tbl"><table>
        <thead><tr><th>Level</th><th class="n">Answered</th><th class="n">Correct</th><th class="n">Accuracy</th><th class="n">Avg time</th></tr></thead>
        <tbody>
          <tr><td>Exam level</td><td class="n">${s.S.n}</td><td class="n">${s.S.ok}</td><td class="n">${pctL("S")}</td><td class="n">${s.S.n ? Math.round(s.S.sec/s.S.n) + " s" : "–"}</td></tr>
          <tr><td>Harder</td><td class="n">${s.H.n}</td><td class="n">${s.H.ok}</td><td class="n">${pctL("H")}</td><td class="n">${s.H.n ? Math.round(s.H.sec/s.H.n) + " s" : "–"}</td></tr>
          ${afterSkip.length ? `<tr><td>Answered after skipping</td><td class="n">${afterSkip.length}</td><td class="n">${afterSkip.filter(id => att.answers[id].ok).length}</td><td class="n">${Math.round(afterSkip.filter(id => att.answers[id].ok).length/afterSkip.length*100)}%</td><td class="n">–</td></tr>` : ""}
        </tbody>
      </table></div>
      <div class="qnav">
        <button class="btn ghost" id="home">← All chapters</button>
        <div>
          ${sk.length ? `<button class="btn warn" id="doSk">Answer ${sk.length} skipped</button>` : ""}
          ${wrongIds.length ? `<button class="btn" id="retry">Retry ${wrongIds.length} wrong</button>` : ""}
          <button class="btn ghost" id="again">Redo chapter</button>
        </div>
      </div>
      ${sk.length ? `<h3 style="margin-top:16px">Skipped, still open (${sk.length})</h3>
        <div class="review">${sk.map(id => `<div class="rv sk"><p>${esc(qById[id].q)}</p></div>`).join("")}</div>` : ""}
      <h3 style="margin-top:16px">Slowest questions</h3>
      <div class="tbl"><table><thead><tr><th>Question</th><th class="n">Time</th><th>Result</th></tr></thead><tbody>
        ${slow.map(a => `<tr><td>${esc(qById[a.id].q)}</td><td class="n">${fmt(a.sec)}</td><td>${a.ok ? "Correct" : "Wrong"}</td></tr>`).join("") || `<tr><td colspan="3">No answers yet.</td></tr>`}
      </tbody></table></div>
      <h3 style="margin-top:16px">Your wrong answers (${wrongIds.length})</h3>
      <div class="review">${wrongIds.map(id => { const q = qById[id], a = att.answers[id]; return `<div class="rv">
        <p><b>${esc(q.q)}</b></p>
        <p>Your answer: ${esc(q.o[a.c])} — ${esc(q.x[a.c] || "")}</p>
        <p>Correct: <b>${esc(q.o[q.a])}</b>. ${esc(q.why)}</p></div>`; }).join("") || "<p class='sub'>None.</p>"}</div>
    </section>`;
  $("#home").onclick = renderHome;
  $("#again").onclick = () => startChapter(att.ch);
  if (wrongIds.length) $("#retry").onclick = () => startChapter(att.ch, wrongIds);
  if (sk.length) $("#doSk").onclick = () => answerSkipped(att);
  window.scrollTo(0,0);
}

renderHome();
</script>
