<style>
/* Layout: exam-terminal feel — top status bar (chapter, Q x/N, timers), one question card, instant verdict panel below */
:root{
  --bg:#eef1f4; --surface:#ffffff; --fg:#14202b; --muted:#56636f; --line:#d0d8e0;
  --accent:#b86e00; --accent-soft:#fbefd9; --teal:#0d6a73; --teal-soft:#dff0f1;
  --ok:#1f7a35; --ok-soft:#e1f3e5; --bad:#b3261e; --bad-soft:#fbe4e2;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#16202a; --fg:#e4eaef; --muted:#97a5b1; --line:#2a3743;
  --accent:#f2a73d; --accent-soft:#3a2c14; --teal:#5bbcc6; --teal-soft:#123338;
  --ok:#7fd18f; --ok-soft:#163222; --bad:#ff8a80; --bad-soft:#3b1b19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#16202a; --fg:#e4eaef; --muted:#97a5b1; --line:#2a3743;
  --accent:#f2a73d; --accent-soft:#3a2c14; --teal:#5bbcc6; --teal-soft:#123338;
  --ok:#7fd18f; --ok-soft:#163222; --bad:#ff8a80; --bad-soft:#3b1b19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.9rem}
h2{font-size:1.3rem}
.sub{color:var(--muted);margin:4px 0 0}
.lvl{font:600 .72rem var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--fg);color:var(--bg);border:0;border-radius:4px;padding:9px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.warn{background:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:600 .75rem var(--f-mono);padding:2px 7px;border-radius:3px;background:var(--teal-soft);color:var(--teal)}
.chip.mk{background:var(--accent-soft);color:var(--accent)}
.chip.sk{background:var(--bad-soft);color:var(--bad)}
/* home */
.cards{display:grid;gap:10px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
.card>*{min-width:0}
.card .bar{grid-column:1/-1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.card .bar i{display:block;height:100%;background:var(--teal)}
.card .bar b{display:block;height:100%;background:var(--accent)}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.rank{font:700 1.4rem var(--f-display);color:var(--accent);margin-right:6px}
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);padding:10px 12px;margin-top:16px;font-size:.92rem}
/* quiz */
.status{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.88rem}
.status b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.status .sp{flex:1}
.prog{height:4px;background:var(--line);margin-top:10px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qcard{background:var(--surface);border:1px solid var(--line);padding:18px;margin-top:14px}
.qtext{font-size:1.1rem;font-weight:600;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.opt:hover:not(:disabled){border-color:var(--fg)}
.opt .k{font:700 .85rem var(--f-mono);border:1px solid var(--line);border-radius:3px;text-align:center;padding:1px 0;background:var(--surface)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right .k{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.verdict{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.verdict .head{font:700 1.1rem var(--f-display)}
.verdict .head.ok{color:var(--ok)}.verdict .head.bad{color:var(--bad)}
.vrow{display:grid;grid-template-columns:120px 1fr;gap:10px;font-size:.93rem}
.vrow>span:first-child{font:600 .72rem var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-top:3px}
.others{font-size:.88rem;color:var(--muted);margin:0;padding-left:18px}
.others li{margin:3px 0}
.qnav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.qnav>div{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);padding:16px;margin-top:18px;display:grid;gap:10px}
.panel ol{margin:0;padding-left:20px;font-size:.92rem}
.panel ol li{margin:3px 0}
/* summary */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);padding:10px 12px}
.tile b{display:block;font:700 1.5rem var(--f-display);font-variant-numeric:tabular-nums}
.tile span{font-size:.8rem;color:var(--muted)}
.tile.good b{color:var(--ok)}.tile.poor b{color:var(--bad)}.tile.skip b{color:var(--accent)}
.tbl{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem;background:var(--surface)}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--teal-soft)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.review{display:grid;gap:10px;margin-top:10px}
.rv{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--bad);padding:10px 12px;font-size:.92rem}
.rv.sk{border-left-color:var(--accent)}
.rv p{margin:4px 0}
.saved{font-size:.8rem;color:var(--muted)}
@media (max-width:520px){.vrow{grid-template-columns:1fr;gap:2px}.card{grid-template-columns:1fr}.card .acts{justify-content:flex-start}}
</style>

<script>
const BANK = {"storageKey":"nismvd-attempts-v1","chapters":[{"ch":15,"name":"Forwards & Futures","marks":15,"n":77,"s":47,"h":30},{"ch":16,"name":"Options","marks":13,"n":68,"s":43,"h":25},{"ch":13,"name":"Basics of Derivatives","marks":10,"n":50,"s":30,"h":20},{"ch":20,"name":"Exchange Traded IR Futures","marks":10,"n":51,"s":29,"h":22}],"questions":[{"id":"c15-001","ch":15,"lvl":"S","q":"A portfolio worth ₹3,00,00,000 has a beta of 0.8. Index futures trade at 24,000 with a lot size of 50. How many lots should be sold to hedge fully?","o":["20 lots","1000 lots","31 lots","25 lots"],"a":0,"why":"Lot value = 24,000 × 50 = ₹12,00,000. Lots = Portfolio × β ÷ lot value = ₹3,00,00,000 × 0.8 ÷ ₹12,00,000 = 20.","x":[null,"You multiplied by lot size twice.","You divided by beta. Multiply instead.","You ignored beta. Multiply portfolio value by beta."]},{"id":"c15-002","ch":15,"lvl":"S","q":"Futures are trading above their fair value. What does an arbitrageur do?","o":["Sell spot and buy futures","Sell both spot and futures","Buy both spot and futures","Buy in the spot market and sell futures (cash-and-carry)"],"a":3,"why":"Sell the overpriced futures, buy the cheaper spot, carry it to expiry.","x":["That's reverse cash-and-carry, used when futures are cheap.","Two short positions is a directional bet.","Two long positions is a directional bet.",null]},{"id":"c15-003","ch":15,"lvl":"S","q":"In exchange-traded futures, who bears the counterparty risk?","o":["The seller","SEBI","The clearing corporation","The buyer"],"a":2,"why":"Through novation the clearing corporation stands between buyer and seller.","x":["Same: the seller faces the clearing corporation.","SEBI regulates, it doesn't guarantee trades.",null,"The buyer faces the clearing corporation, not the seller."]},{"id":"c15-004","ch":15,"lvl":"H","q":"An arbitrage mutual fund mainly does cash-and-carry trades. Its return should be close to:","o":["Twice the Nifty return","The short-term interest rate","The Nifty return","Zero"],"a":1,"why":"Cash-and-carry earns the carry — roughly the money-market rate — with no market risk.","x":["No leverage like that.",null,"Market risk is hedged away.","It earns the carry."]},{"id":"c15-005","ch":15,"lvl":"H","q":"Spot is ₹2,500, interest is 7% a year (continuously compounded), time to expiry 0.25 years, no dividends. What is the fair futures price?","o":["₹2,543.75","₹2,456.63","₹2,544.14","₹2,681.27"],"a":2,"why":"F = S × e^(rt) = 2,500 × e^(0.0175) = ₹2,544.14.","x":["That's simple interest. The question says continuous compounding.","You discounted instead of compounding.",null,"You used a full year instead of t."]},{"id":"c15-006","ch":15,"lvl":"S","q":"Futures price rises and open interest falls. This usually signals:","o":["Long unwinding","Short build-up","Long build-up","Short covering"],"a":3,"why":"Shorts buy back to close positions, so OI drops while price rises.","x":["That needs falling price.","That needs falling price and rising OI.","That needs rising OI.",null]},{"id":"c15-007","ch":15,"lvl":"S","q":"Futures price rises and open interest rises. This usually signals:","o":["Short build-up","Long unwinding","Long build-up (bullish)","Short covering"],"a":2,"why":"New buyers are opening positions and pushing price up.","x":["That's price falling with OI rising.","That's price falling with OI falling.",null,"That's price rising with OI falling."]},{"id":"c15-008","ch":15,"lvl":"S","q":"How often are futures positions marked to market?","o":["Monthly","Weekly","Daily","Only at expiry"],"a":2,"why":"Gains and losses are settled every trading day at the daily settlement price.","x":["Too slow.","Too slow. MTM is daily.",null,"That would be a forward."]},{"id":"c15-009","ch":15,"lvl":"H","q":"Index futures trade below spot during dividend season. Most likely reason:","o":["Expected dividends exceed the interest cost (backwardation)","Arbitrageurs have left the market","Interest rates have risen","Margins have fallen"],"a":0,"why":"F = S × (1 + r − d). When d is high, F can fall below S.","x":[null,"Arbitrage keeps futures near fair value, which here is below spot.","Higher rates push futures up.","Margins don't enter fair value."]},{"id":"c15-010","ch":15,"lvl":"H","q":"A ₹1 crore portfolio (beta 1) is fully hedged by selling Nifty futures. Nifty falls 5%; the portfolio falls 6%. Ignoring basis, what is the net result?","o":["Loss of ₹6,00,000","Loss of about ₹1,00,000","Gain of ₹5,00,000","Zero: the hedge is perfect"],"a":1,"why":"Portfolio: -6% = −₹6,00,000. Futures gain: 5% = ₹5,00,000. Net = −₹1,00,000. The hedge removes market risk, not stock-specific risk.","x":["You forgot the futures gain.",null,"You forgot the portfolio loss.","The portfolio moved differently from the index. That gap is not hedged."]},{"id":"c15-011","ch":15,"lvl":"S","q":"Reverse cash-and-carry arbitrage involves:","o":["Selling the spot and buying futures","Buying futures only","Buying a call and a put","Buying spot and selling futures"],"a":0,"why":"Used when futures are below fair value: buy the cheap futures, sell (short) the spot.","x":[null,"One leg alone isn't arbitrage.","That's a straddle.","That's normal cash-and-carry."]},{"id":"c15-012","ch":15,"lvl":"S","q":"For index futures, the cost of carry equals:","o":["Interest cost minus dividend yield","Interest cost plus dividend yield","Brokerage plus STT","Initial margin rate"],"a":0,"why":"Holding the index costs interest but earns dividends; net carry = r − d.","x":[null,"Dividends reduce carry; you receive them.","Transaction costs aren't the carry in the pricing model.","Margin is not part of fair value."]},{"id":"c15-013","ch":15,"lvl":"S","q":"Spot price is ₹5,000, the interest rate is 6% a year and there are no dividends. Using simple interest, what is the fair price of a 2-month futures?","o":["₹5,300.00","₹5,000.00","₹5,050.00","₹5,025.00"],"a":2,"why":"F = S × (1 + r × t) = 5,000 × (1 + 0.06 × 2/12) = ₹5,050.00.","x":["You used a full year. Use t = months ÷ 12.","Futures trade at spot + carry, not at spot.",null,"You used 1 month instead of the stated period."]},{"id":"c15-014","ch":15,"lvl":"H","q":"A hedger holds shares and is short futures. The basis (spot − futures) moves from -30 to -55. What is the effect on the hedger per unit?","o":["Gain of 25","No effect: the hedge is perfect","Loss of 25","Loss of 85"],"a":2,"why":"Long spot + short futures gains when basis (S − F) increases (strengthens). Change = -55 − (-30) = -25.","x":["Direction reversed. A short hedger gains when basis strengthens.","Basis risk remains even in a hedge.",null,"Basis change is the difference, not the sum."]},{"id":"c15-015","ch":15,"lvl":"H","q":"Nifty spot is 24,000, risk-free rate 6.5%, dividend yield 1.5% (both continuous). What is the fair price of the 2-month futures?","o":["24,261.41","24,322.14","25,230.51","24,200.84"],"a":3,"why":"F = S × e^((r − d) × t) = 24,000 × e^(0.050 × 0.1667) = 24,200.84.","x":["You ignored the dividend yield.","You added dividend yield. It reduces carry.","You used a full year.",null]},{"id":"c15-016","ch":15,"lvl":"S","q":"Index futures may trade below spot (backwardation) when:","o":["Interest rates are very high","The expected dividend yield is higher than the interest rate","Time to expiry is long","Margins are high"],"a":1,"why":"Fair futures ≈ Spot × (1 + r − d). If d > r, futures fall below spot.","x":["High r pushes futures above spot.",null,"Longer time magnifies the carry, whichever way it points.","Margins don't enter the fair-value formula."]},{"id":"c15-017","ch":15,"lvl":"S","q":"Open interest in futures means:","o":["The number of contracts still outstanding (not closed)","The interest rate in the futures price","The number of contracts traded today","The total margin collected"],"a":0,"why":"Each open contract has one long and one short; OI counts them once.","x":[null,"Unrelated.","That's volume.","Unrelated."]},{"id":"c15-018","ch":15,"lvl":"S","q":"Basis is defined as:","o":["Futures price − spot price","Spot price − futures price","Spot price ÷ futures price","Futures price × lot size"],"a":1,"why":"Basis = Spot − Futures. In a normal (contango) market, basis is negative.","x":["Sign reversed. NISM defines basis as spot minus futures.",null,"Basis is a difference, not a ratio.","That's notional value."]},{"id":"c15-019","ch":15,"lvl":"H","q":"A trader buys 1 lot of futures at ₹1500 (lot 400). Settlement prices: Day 1 ₹1540, Day 2 ₹1512, Day 3 ₹1521. What is the MTM cash flow on Day 3?","o":["−₹11,200","₹8,400","−₹3,600","₹3,600"],"a":3,"why":"Day 3 MTM = (Day 3 − Day 2) × lot = (1521 − 1512) × 400 = ₹3,600. Each day settles against the previous day's price.","x":["That's Day 2's MTM. Day 3 compares Day 3 with Day 2.","That's the cumulative P&L since entry, not Day 3's MTM.","Sign reversed. A long gains when price rises.",null]},{"id":"c15-020","ch":15,"lvl":"H","q":"Nifty spot is 20,000, risk-free rate 7%, dividend yield 2% (both continuous). What is the fair price of the 3-month futures?","o":["21,025.42","20,353.08","20,251.57","20,455.10"],"a":2,"why":"F = S × e^((r − d) × t) = 20,000 × e^(0.050 × 0.2500) = 20,251.57.","x":["You used a full year.","You ignored the dividend yield.",null,"You added dividend yield. It reduces carry."]},{"id":"c15-021","ch":15,"lvl":"S","q":"A trader bought 1 lot(s) of stock futures at ₹3,150, lot size 250. The settlement price today is ₹3,201. What is today's MTM?","o":["Gain of ₹25,500","Loss of ₹12,750","Gain of ₹12,750","Gain of ₹51"],"a":2,"why":"MTM = (settle − entry) × lot × lots = ₹12,750.","x":["Check the number of lots.","Right size, wrong sign. A long gains when price rises; a short gains when price falls.",null,"You forgot to multiply by lot size."]},{"id":"c15-022","ch":15,"lvl":"S","q":"Spot Nifty/stock price is 24,500 and the near-month futures is 24,650. What is the basis?","o":["49,150","+150","0","-150"],"a":3,"why":"Basis = Spot − Futures = 24,500 − 24,650 = -150.","x":["Basis is a difference, not a sum.","Sign reversed. Basis = spot − futures.","Basis is zero only at expiry.",null]},{"id":"c15-023","ch":15,"lvl":"S","q":"Stock futures in India are settled at expiry by:","o":["Settlement in the next month's contract","Physical delivery of the shares","Delivery of index units","Cash only"],"a":1,"why":"SEBI moved all stock derivatives to physical settlement in phases from 2018–19.","x":["Expired contracts settle; they don't roll automatically.",null,"No.","Stock futures were cash settled earlier, but now they're physically settled."]},{"id":"c15-024","ch":15,"lvl":"H","q":"Which is the BEST reason for an investor to hedge with futures rather than sell the shares?","o":["Futures hedges remove all risk","To keep the shares (and avoid sale costs or tax) while removing market risk for a period","Futures guarantee a profit","Futures don't need margin"],"a":1,"why":"Selling triggers costs and capital gains tax; a futures hedge removes risk temporarily.","x":["Basis and stock-specific risk remain.",null,"No.","They do."]},{"id":"c15-025","ch":15,"lvl":"H","q":"A ₹2,00,00,000 portfolio has beta 0.9. The manager wants beta 1.2. Index futures: 20,000, lot 60. What should the manager do?","o":["Buy 15 lots","Buy 5 lots","Buy 300 lots","Sell 5 lots"],"a":1,"why":"Lots = (target β − current β) × P ÷ lot value = (1.2 − 0.9) × ₹2,00,00,000 ÷ ₹12,00,000 = +5. Negative = sell, positive = buy.","x":["You used the full beta (or ignored beta) instead of the change in beta.",null,"You divided by the index level only. Divide by lot value (price × lot).","Right size, wrong direction. To cut beta, sell; to raise it, buy."]},{"id":"c15-026","ch":15,"lvl":"S","q":"A portfolio worth ₹90,00,000 has a beta of 1.5. Index futures trade at 22,500 with a lot size of 40. How many lots should be sold to hedge fully?","o":["600 lots","10 lots","7 lots","15 lots"],"a":3,"why":"Lot value = 22,500 × 40 = ₹9,00,000. Lots = Portfolio × β ÷ lot value = ₹90,00,000 × 1.5 ÷ ₹9,00,000 = 15.","x":["You multiplied by lot size twice.","You ignored beta. Multiply portfolio value by beta.","You divided by beta. Multiply instead.",null]},{"id":"c15-027","ch":15,"lvl":"S","q":"Futures price falls and open interest rises. This usually signals:","o":["Long build-up","Short covering","Short build-up (bearish)","Long unwinding"],"a":2,"why":"New sellers are opening positions and pushing price down.","x":["That's price up, OI up.","That's price up, OI down.",null,"That's price down, OI down."]},{"id":"c15-028","ch":15,"lvl":"S","q":"Equity futures in India follow a contract cycle of:","o":["Twelve months","Three months (near, middle and far month)","One month only","Six months"],"a":1,"why":"At any time, three monthly contracts are available.","x":["Not for stock and index futures.",null,"Three months are available.","That's longer than the standard cycle."]},{"id":"c15-029","ch":15,"lvl":"H","q":"Basis risk arises mainly when:","o":["The futures is held to expiry on the same asset","Margins are paid on time","The trader uses options","The hedge instrument differs from the asset, or the hedge is closed before expiry"],"a":3,"why":"If the asset and futures don't move one-for-one, or you exit before convergence, the hedge is imperfect.","x":["Then basis converges to zero — no basis risk.","Margin timing isn't basis risk.","Options have their own risks; the question is about futures hedges.",null]},{"id":"c15-030","ch":15,"lvl":"H","q":"A trader buys 1 lot of futures at ₹2000 (lot 250). Settlement prices: Day 1 ₹1980, Day 2 ₹2010, Day 3 ₹1995. What is the MTM cash flow on Day 3?","o":["₹7,500","−₹1,250","₹3,750","−₹3,750"],"a":3,"why":"Day 3 MTM = (Day 3 − Day 2) × lot = (1995 − 2010) × 250 = −₹3,750. Each day settles against the previous day's price.","x":["That's Day 2's MTM. Day 3 compares Day 3 with Day 2.","That's the cumulative P&L since entry, not Day 3's MTM.","Sign reversed. A long gains when price rises.",null]},{"id":"c15-031","ch":15,"lvl":"S","q":"A forward contract is traded:","o":["On a stock exchange","Only by RBI","Only through the clearing corporation","Over the counter, between two parties"],"a":3,"why":"Forwards are private, custom contracts. No exchange, no daily MTM.","x":["Futures are exchange-traded; forwards are not.","Anyone with a counterparty can enter a forward.","The clearing corporation handles exchange trades.",null]},{"id":"c15-032","ch":15,"lvl":"S","q":"A trader sold 3 lot(s) of stock futures at ₹850, lot size 600. The settlement price today is ₹838. What is today's MTM?","o":["Gain of ₹21,600","Gain of ₹36","Gain of ₹7,200","Loss of ₹21,600"],"a":0,"why":"MTM = (entry − settle) × lot × lots = ₹21,600.","x":[null,"You forgot to multiply by lot size.","Check the number of lots.","Right size, wrong sign. A long gains when price rises; a short gains when price falls."]},{"id":"c15-033","ch":15,"lvl":"S","q":"A portfolio worth ₹1,50,00,000 has a beta of 1.25. Index futures trade at 25,000 with a lot size of 75. How many lots should be sold to hedge fully?","o":["10 lots","6 lots","750 lots","8 lots"],"a":0,"why":"Lot value = 25,000 × 75 = ₹18,75,000. Lots = Portfolio × β ÷ lot value = ₹1,50,00,000 × 1.25 ÷ ₹18,75,000 = 10.","x":[null,"You divided by beta. Multiply instead.","You multiplied by lot size twice.","You ignored beta. Multiply portfolio value by beta."]},{"id":"c15-034","ch":15,"lvl":"H","q":"Spot ₹800, 1-month futures ₹815, interest 9% a year (simple), total transaction costs ₹4 per share. What is the net arbitrage profit per share?","o":["₹11.00","₹5.00","₹9.00","₹15.00"],"a":1,"why":"Fair = 800 × (1 + 0.09 × 1/12) = 806.00. Gross = 9.00. Net = gross − 4 = ₹5.00.","x":["You ignored the interest cost of carrying the spot.",null,"You ignored transaction costs.","Raw gap: you ignored both interest and costs."]},{"id":"c15-035","ch":15,"lvl":"H","q":"Price rises sharply while open interest falls steadily. How should this rally be read?","o":["Short covering — the rally may be weak and not driven by fresh buying","Long unwinding","Strong long build-up","Short build-up"],"a":0,"why":"Rising price with falling OI = shorts buying back, not new longs.","x":[null,"That needs falling price.","Long build-up needs rising OI.","That needs falling price."]},{"id":"c15-036","ch":15,"lvl":"S","q":"As expiry approaches, the futures price:","o":["Moves towards the spot price","Moves away from the spot price","Becomes fixed","Doubles"],"a":0,"why":"Carry shrinks as time shrinks; at expiry, futures = spot.","x":[null,"Opposite of convergence.","It keeps trading till expiry.","No."]},{"id":"c15-037","ch":15,"lvl":"S","q":"In a futures contract, who deposits initial margin?","o":["Only the buyer","Only the seller","Neither","Both the buyer and the seller"],"a":3,"why":"Both sides have obligations, so both post margin. (In options, only the seller does.)","x":["Both.","That's options.","Margin is always required.",null]},{"id":"c15-038","ch":15,"lvl":"S","q":"Margin money in futures is best described as:","o":["A fee to the exchange","Premium paid to the seller","Part payment for the asset","A performance guarantee deposit"],"a":3,"why":"Margin is a deposit to make sure you can meet losses; it is not a part payment for the asset.","x":["Fees are separate; margin is returned when you close.","Premium belongs to options.","You don't pay for the asset until delivery (if any).",null]},{"id":"c15-039","ch":15,"lvl":"H","q":"A calendar spread needs lower margin than an outright futures position because:","o":["Calendar spreads cannot lose money","The long and short legs offset most of the price risk","The exchange gives a discount to all traders","Calendar spreads are not marked to market"],"a":1,"why":"Both legs move with the same underlying, so the net risk is small.","x":["They can lose if the gap moves against you.",null,"Not a discount — it's lower risk.","Both legs are marked to market."]},{"id":"c15-040","ch":15,"lvl":"H","q":"A ₹6,00,00,000 portfolio has beta 1.1. The manager wants beta 0. Index futures: 25,000, lot 60. What should the manager do?","o":["Buy 44 lots","Sell 40 lots","Sell 2640 lots","Sell 44 lots"],"a":3,"why":"Lots = (target β − current β) × P ÷ lot value = (0 − 1.1) × ₹6,00,00,000 ÷ ₹15,00,000 = -44. Negative = sell, positive = buy.","x":["Right size, wrong direction. To cut beta, sell; to raise it, buy.","You used the full beta (or ignored beta) instead of the change in beta.","You divided by the index level only. Divide by lot value (price × lot).",null]},{"id":"c15-041","ch":15,"lvl":"S","q":"A stock trades at ₹2,400. A dividend of ₹30 is due before expiry (ignore discounting). The interest rate is 8% a year. What is the fair price of a 6-month futures (simple interest)?","o":["₹2,370.00","₹2,527.20","₹2,464.80","₹2,496.00"],"a":2,"why":"Remove the dividend first: (2,400 − 30) × (1 + 0.08 × 6/12) = ₹2,464.80.","x":["You removed the dividend but forgot the interest.","You added the dividend. It should be subtracted.",null,"You ignored the dividend. The futures buyer doesn't get it, so subtract it."]},{"id":"c15-042","ch":15,"lvl":"S","q":"Spot price is ₹2,000, the interest rate is 10% a year and there are no dividends. Using simple interest, what is the fair price of a 3-month futures?","o":["₹2,200.00","₹2,000.00","₹2,050.00","₹2,016.67"],"a":2,"why":"F = S × (1 + r × t) = 2,000 × (1 + 0.1 × 3/12) = ₹2,050.00.","x":["You used a full year. Use t = months ÷ 12.","Futures trade at spot + carry, not at spot.",null,"You used 1 month instead of the stated period."]},{"id":"c15-043","ch":15,"lvl":"S","q":"Spot is ₹1,000, 3-month futures is ₹1,040 and the interest rate is 12% a year (simple). Ignoring costs, what arbitrage profit per share is available?","o":["₹10.00 by buying spot and selling futures","₹40.00 by buying spot and selling futures","No arbitrage is available","₹10.00 by selling spot and buying futures"],"a":0,"why":"Fair value = 1,000 × (1 + 0.12 × 3/12) = 1,030.00. Futures is ₹10.00 too high → cash-and-carry.","x":[null,"That's the raw gap. You forgot the interest cost of carrying the spot.","Futures is above fair value, so cash-and-carry pays.","Wrong direction. Futures is overpriced, so sell it."]},{"id":"c15-044","ch":15,"lvl":"H","q":"An investor will receive a bonus next month and plans to buy an index fund. She buys index futures now. The market falls 6%. What happens?","o":["Her hedge was wrong because the market fell","She loses on futures, but buys the index cheaper — net price ≈ locked","She loses 12% in total","She gains on futures and buys cheaper"],"a":1,"why":"A long hedge locks the price both ways: the futures loss is matched by the cheaper purchase.","x":["A hedge locks the price; direction doesn't make it wrong.",null,"The futures loss is offset by the cheaper buying price.","Long futures lose when the market falls."]},{"id":"c15-045","ch":15,"lvl":"H","q":"A portfolio is fully beta-hedged with index futures. What return should it earn, ignoring alpha and costs?","o":["Zero, always","The market return","Roughly the risk-free rate","Twice the market return"],"a":2,"why":"Market risk is removed; holding a riskless position should earn the risk-free rate (via the futures' carry).","x":["The futures carry gives about the risk-free rate.","Market exposure is removed.",null,"No."]},{"id":"c15-046","ch":15,"lvl":"S","q":"Hedging with futures generally:","o":["Removes only downside","Increases profit potential","Removes both downside and upside","Removes basis risk"],"a":2,"why":"The futures gain/loss offsets the asset's loss/gain. You lock the value.","x":["That needs a put option.","It reduces it.",null,"Basis risk remains."]},{"id":"c15-047","ch":15,"lvl":"S","q":"Futures price falls and open interest falls. This usually signals:","o":["Long build-up","Short build-up","Short covering","Long unwinding"],"a":3,"why":"Longs sell to close positions; price falls and OI drops.","x":["That needs rising price and OI.","That needs rising OI.","That needs rising price.",null]},{"id":"c15-048","ch":15,"lvl":"S","q":"Spot is ₹2,500, 2-month futures is ₹2,560 and the interest rate is 6% a year (simple). Ignoring costs, what arbitrage profit per share is available?","o":["₹35.00 by buying spot and selling futures","No arbitrage is available","₹60.00 by buying spot and selling futures","₹35.00 by selling spot and buying futures"],"a":0,"why":"Fair value = 2,500 × (1 + 0.06 × 2/12) = 2,525.00. Futures is ₹35.00 too high → cash-and-carry.","x":[null,"Futures is above fair value, so cash-and-carry pays.","That's the raw gap. You forgot the interest cost of carrying the spot.","Wrong direction. Futures is overpriced, so sell it."]},{"id":"c15-049","ch":15,"lvl":"H","q":"Spot is ₹4,000 and the 3-month futures is ₹4,060. No dividends. What annual interest rate (simple) is implied?","o":["1.50%","6.0%","3.0%","12.0%"],"a":1,"why":"Return for the period = 60/4000 = 1.50%. Annualise: × 12/3 = 6.0%.","x":["Not annualised.",null,"Check the annualising factor: multiply by 12 ÷ months.","Check the annualising factor."]},{"id":"c15-050","ch":15,"lvl":"H","q":"A ₹1 crore portfolio (beta 1) is fully hedged by selling Nifty futures. Nifty falls 4%; the portfolio falls 3%. Ignoring basis, what is the net result?","o":["Loss of ₹3,00,000","Zero: the hedge is perfect","Gain of ₹4,00,000","Gain of about ₹1,00,000"],"a":3,"why":"Portfolio: -3% = −₹3,00,000. Futures gain: 4% = ₹4,00,000. Net = ₹1,00,000. The hedge removes market risk, not stock-specific risk.","x":["You forgot the futures gain.","The portfolio moved differently from the index. That gap is not hedged.","You forgot the portfolio loss.",null]},{"id":"c15-051","ch":15,"lvl":"S","q":"A calendar spread in futures means:","o":["Buying futures on two different stocks","Buying spot and selling futures","Buying one month's futures and selling another month's futures on the same underlying","Buying a call and a put"],"a":2,"why":"A bet on the price gap between two expiries, not on direction.","x":["That's an inter-commodity/pair trade.","That's cash-and-carry.",null,"That's a straddle."]},{"id":"c15-052","ch":15,"lvl":"S","q":"Spot price is ₹1,500, the interest rate is 8% a year and there are no dividends. Using simple interest, what is the fair price of a 6-month futures?","o":["₹1,510.00","₹1,500.00","₹1,560.00","₹1,620.00"],"a":2,"why":"F = S × (1 + r × t) = 1,500 × (1 + 0.08 × 6/12) = ₹1,560.00.","x":["You used 1 month instead of the stated period.","Futures trade at spot + carry, not at spot.",null,"You used a full year. Use t = months ÷ 12."]},{"id":"c15-053","ch":15,"lvl":"S","q":"The payoff of a long futures position is:","o":["Limited profit, unlimited loss","Linear, with unlimited profit and unlimited loss","Fixed regardless of price","Limited loss, unlimited profit"],"a":1,"why":"Every ₹1 move in price gives ₹1 × lot profit or loss. No cap on either side.","x":["That's a short call.",null,"Futures P&L moves with the price.","That's a long call."]},{"id":"c15-054","ch":15,"lvl":"H","q":"A trader buys 1 lot of futures at ₹900 (lot 1000). Settlement prices: Day 1 ₹905, Day 2 ₹890, Day 3 ₹880. What is the MTM cash flow on Day 3?","o":["−₹15,000","−₹10,000","−₹20,000","₹10,000"],"a":1,"why":"Day 3 MTM = (Day 3 − Day 2) × lot = (880 − 890) × 1000 = −₹10,000. Each day settles against the previous day's price.","x":["That's Day 2's MTM. Day 3 compares Day 3 with Day 2.",null,"That's the cumulative P&L since entry, not Day 3's MTM.","Sign reversed. A long gains when price rises."]},{"id":"c15-055","ch":15,"lvl":"H","q":"Other things equal, if interest rates rise, the fair value of stock futures will:","o":["Stay the same","Become equal to spot","Fall","Rise"],"a":3,"why":"F = S × (1 + r × t). Higher r → higher F.","x":["r is a direct input.","Only at expiry.","Higher carry raises F.",null]},{"id":"c15-056","ch":15,"lvl":"S","q":"A long futures position has an MTM loss today. The trader must:","o":["Wait until expiry to pay","Exercise the contract","Receive cash from the clearing corporation","Pay the loss in cash to the clearing corporation"],"a":3,"why":"MTM losses are paid in cash, usually next day.","x":["That's a forward.","Exercise applies to options.","Receiving is for MTM gains.",null]},{"id":"c15-057","ch":15,"lvl":"S","q":"A trader bought 2 lot(s) of stock futures at ₹1,200, lot size 500. The settlement price today is ₹1,185. What is today's MTM?","o":["Gain of ₹15,000","Loss of ₹7,500","Loss of ₹30","Loss of ₹15,000"],"a":3,"why":"MTM = (settle − entry) × lot × lots = −₹15,000.","x":["Right size, wrong sign. A long gains when price rises; a short gains when price falls.","Check the number of lots.","You forgot to multiply by lot size.",null]},{"id":"c15-058","ch":15,"lvl":"S","q":"A market where futures prices are higher than the spot price is in:","o":["Contango","Convergence","Backwardation","Arbitrage"],"a":0,"why":"Contango = futures > spot (normal, because of carrying cost). Backwardation = futures < spot.","x":[null,"Convergence is futures moving to spot near expiry.","Backwardation is futures below spot.","Arbitrage is a trade, not a market state."]},{"id":"c15-059","ch":15,"lvl":"H","q":"Rolling over a futures position means:","o":["Doubling the position","Closing the near-month contract and opening the next-month contract","Paying MTM late","Converting futures into options"],"a":1,"why":"Done near expiry to keep the exposure. The cost is the price gap between the two months.","x":["Rollover keeps the size the same.",null,"No.","Not possible."]},{"id":"c15-060","ch":15,"lvl":"H","q":"A hedger holds shares and is short futures. The basis (spot − futures) moves from -50 to -20. What is the effect on the hedger per unit?","o":["No effect: the hedge is perfect","Gain of 30","Gain of 70","Loss of 30"],"a":1,"why":"Long spot + short futures gains when basis (S − F) increases (strengthens). Change = -20 − (-50) = +30.","x":["Basis risk remains even in a hedge.",null,"Basis change is the difference, not the sum.","Direction reversed. A short hedger gains when basis strengthens."]},{"id":"c15-061","ch":15,"lvl":"S","q":"A stock trades at ₹1,000. A dividend of ₹20 is due before expiry (ignore discounting). The interest rate is 12% a year. What is the fair price of a 3-month futures (simple interest)?","o":["₹1,009.40","₹1,050.60","₹1,030.00","₹980.00"],"a":0,"why":"Remove the dividend first: (1,000 − 20) × (1 + 0.12 × 3/12) = ₹1,009.40.","x":[null,"You added the dividend. It should be subtracted.","You ignored the dividend. The futures buyer doesn't get it, so subtract it.","You removed the dividend but forgot the interest."]},{"id":"c15-062","ch":15,"lvl":"S","q":"At expiry of a futures contract, the basis is:","o":["Zero","Equal to the initial margin","Equal to the cost of carry","Always negative"],"a":0,"why":"Convergence: on expiry day futures settle at the spot price, so spot − futures = 0.","x":[null,"Margin is unrelated to basis.","Carry shrinks to zero as time to expiry shrinks to zero.","Negative basis is normal before expiry, not at expiry."]},{"id":"c15-063","ch":15,"lvl":"S","q":"Index futures in India are settled:","o":["At the buyer's choice","In gold","In cash","By physical delivery of all index shares"],"a":2,"why":"An index can't be delivered, so only the price difference is paid.","x":["No choice; settlement is fixed by the exchange.","No.",null,"Impossible in practice. Index futures are cash settled."]},{"id":"c15-064","ch":15,"lvl":"H","q":"Hedging a mid-cap portfolio with Nifty 50 futures is an example of:","o":["A calendar spread","Cash-and-carry arbitrage","A cross hedge","A perfect hedge"],"a":2,"why":"The hedge instrument (Nifty 50) differs from the asset (mid-caps), so basis risk is higher.","x":["That uses two expiries of the same futures.","That needs spot and futures on the same asset.",null,"Different assets — not perfect."]},{"id":"c15-065","ch":15,"lvl":"H","q":"Spot ₹1,500, 2-month futures ₹1,530, interest 8% a year (simple), total transaction costs ₹6 per share. What is the net arbitrage profit per share?","o":["₹30.00","₹24.00","₹4.00","₹10.00"],"a":2,"why":"Fair = 1,500 × (1 + 0.08 × 2/12) = 1,520.00. Gross = 10.00. Net = gross − 6 = ₹4.00.","x":["Raw gap: you ignored both interest and costs.","You ignored the interest cost of carrying the spot.",null,"You ignored transaction costs."]},{"id":"c15-066","ch":15,"lvl":"S","q":"Spot Nifty/stock price is 1,810 and the near-month futures is 1,798. What is the basis?","o":["-12","+12","0","3,608"],"a":1,"why":"Basis = Spot − Futures = 1,810 − 1,798 = +12.","x":["Sign reversed. Basis = spot − futures.",null,"Basis is zero only at expiry.","Basis is a difference, not a sum."]},{"id":"c15-067","ch":15,"lvl":"S","q":"When a stock crosses 95% of its market-wide position limit (MWPL):","o":["Trading in the stock's shares stops","Margins are refunded","All positions are cancelled","It enters a ban period: only trades that reduce positions are allowed"],"a":3,"why":"No fresh positions in that stock's F&O until OI falls below 80% of MWPL.","x":["The cash market continues.","No.","Existing positions stay; only new ones are blocked.",null]},{"id":"c15-068","ch":15,"lvl":"S","q":"An investor holds a share portfolio and fears the market will fall. Which futures trade hedges the risk?","o":["Do nothing; futures can't hedge shares","Buy more shares","Sell index futures","Buy index futures"],"a":2,"why":"Short hedge: losses on shares are offset by gains on the short futures.","x":["Index futures are the standard tool for this.","More exposure, not a hedge.",null,"That doubles the long exposure."]},{"id":"c15-069","ch":15,"lvl":"H","q":"A ₹5,00,00,000 portfolio has beta 1.4. The manager wants beta 0.8. Index futures: 25,000, lot 75. What should the manager do?","o":["Sell 37 lots","Sell 16 lots","Sell 1200 lots","Buy 16 lots"],"a":1,"why":"Lots = (target β − current β) × P ÷ lot value = (0.8 − 1.4) × ₹5,00,00,000 ÷ ₹18,75,000 = -16. Negative = sell, positive = buy.","x":["You used the full beta (or ignored beta) instead of the change in beta.",null,"You divided by the index level only. Divide by lot value (price × lot).","Right size, wrong direction. To cut beta, sell; to raise it, buy."]},{"id":"c15-070","ch":15,"lvl":"H","q":"Spot is ₹1,200 and the 1-month futures is ₹1,209. No dividends. What annual interest rate (simple) is implied?","o":["18.0%","9.0%","4.5%","0.75%"],"a":1,"why":"Return for the period = 9/1200 = 0.75%. Annualise: × 12/1 = 9.0%.","x":["Check the annualising factor.",null,"Check the annualising factor: multiply by 12 ÷ months.","Not annualised."]},{"id":"c15-071","ch":15,"lvl":"S","q":"Why does the futures price usually stay above the spot price?","o":["Because futures have lower risk","Because of high margins","Because buyers expect prices to rise","Because of the cost of carry (interest on money)"],"a":3,"why":"Buying futures instead of spot saves interest, so futures carry that interest in the price.","x":["Futures carry the same price risk.","Margins don't set the price.","Expectations don't set fair value; arbitrage ties futures to spot + carry.",null]},{"id":"c15-072","ch":15,"lvl":"S","q":"An investor will receive cash in one month and wants to invest in equities. She fears the market will rise before then. She should:","o":["Wait for the cash","Sell index futures now","Buy index futures now","Sell call options"],"a":2,"why":"Long (anticipatory) hedge: if the market rises, the futures gain offsets the higher buying price.","x":["Waiting leaves her fully exposed to a rise.","That gains if the market falls — the opposite of her risk.",null,"That gives premium but loses if the market rises."]},{"id":"c15-073","ch":15,"lvl":"S","q":"A trader is bullish on a stock but has limited capital. Which trade gives the most exposure per rupee?","o":["Buy stock futures","Sell stock futures","Buy a put option","Buy shares in the cash market"],"a":0,"why":"Futures need only margin, so the same capital controls a larger position.","x":[null,"That's bearish.","That's bearish.","Full payment needed: less exposure per rupee."]},{"id":"c15-074","ch":15,"lvl":"H","q":"Why is the futures price NOT a forecast of the future spot price?","o":["Arbitrage ties it to spot plus the cost of carry","Because futures ignore interest rates","Because SEBI fixes futures prices","Because futures are illiquid"],"a":0,"why":"If futures drift from spot + carry, arbitrageurs trade the gap away. So futures reflect carry, not a forecast.","x":[null,"Interest is a key input.","Prices are set by the market.","Index futures are very liquid."]},{"id":"c15-075","ch":15,"lvl":"H","q":"Spot is ₹1,000, interest is 8% a year (continuously compounded), time to expiry 0.5 years, no dividends. What is the fair futures price?","o":["₹1,083.29","₹1,040.81","₹1,040.00","₹960.79"],"a":1,"why":"F = S × e^(rt) = 1,000 × e^(0.0400) = ₹1,040.81.","x":["You used a full year instead of t.",null,"That's simple interest. The question says continuous compounding.","You discounted instead of compounding."]},{"id":"c15-076","ch":15,"lvl":"S","q":"The fair value of a futures contract depends on all of the following EXCEPT:","o":["Interest rate","Expected dividends","Spot price","The trader's view of the future spot price"],"a":3,"why":"Fair value = spot, interest rate, time and dividends. Personal views don't enter the formula.","x":["Core input.","Core input for index and stock futures.","Core input.",null]},{"id":"c15-077","ch":15,"lvl":"S","q":"A forward contract has low liquidity mainly because:","o":["It is exchange-traded","It has no underlying","It is marked to market daily","Its terms are customised for the two parties"],"a":3,"why":"A custom contract is hard to transfer to someone else.","x":["Forwards are OTC.","It has one.","Forwards are not marked to market daily.",null]},{"id":"c16-001","ch":16,"lvl":"S","q":"Selling a put option expresses a view that is:","o":["Strongly bearish","Neutral to bearish","Neutral to bullish","Bearish with limited risk"],"a":2,"why":"The writer keeps the premium if the price stays above K.","x":["A falling price hurts the put writer.","A fall hurts the put writer.",null,"Put writer risk is large."]},{"id":"c16-002","ch":16,"lvl":"S","q":"If volatility of the underlying rises (other things equal):","o":["No effect","Both premiums fall","Call premium rises, put premium falls","Both call and put premiums rise"],"a":3,"why":"More volatility = more chance of big moves = options worth more.","x":["Volatility is a key input.","Opposite.","Volatility helps both.",null]},{"id":"c16-003","ch":16,"lvl":"S","q":"The intrinsic value of an out-of-the-money option is:","o":["Equal to the strike price","Equal to its premium minus strike","Zero","Negative"],"a":2,"why":"Intrinsic value = max(0, S − K) for calls, max(0, K − S) for puts. OTM → 0.","x":["No.","Not a valid formula.",null,"Intrinsic value can't be negative."]},{"id":"c16-004","ch":16,"lvl":"H","q":"A call has delta 0.50 and gamma 0.02. The spot rises by ₹10. What is the new delta (approximately)?","o":["0.30","0.70","0.50","0.52"],"a":1,"why":"New delta ≈ 0.50 + gamma × change = 0.50 + 0.02 × 10 = 0.70.","x":["Rising spot increases a call's delta.",null,"Gamma changes delta.","You added gamma only once, not × 10."]},{"id":"c16-005","ch":16,"lvl":"H","q":"A put option has a delta of -0.4. The spot rises by ₹15. Roughly how does the premium change?","o":["Falls by ₹6","Falls by ₹38","Falls by ₹15","Rises by ₹6"],"a":0,"why":"Change ≈ delta × spot change = -0.4 × 15 = -6.","x":[null,"You divided by delta. Multiply.","That assumes delta = 1.","Sign reversed. Call delta is positive; put delta negative."]},{"id":"c16-006","ch":16,"lvl":"S","q":"Gamma is highest for:","o":["Deep in-the-money options","At-the-money options, especially near expiry","Deep out-of-the-money options","Options with long expiry"],"a":1,"why":"Delta changes fastest around the strike.","x":["Their delta is stable near 1.",null,"Their delta is stable near 0.","Gamma rises as expiry nears."]},{"id":"c16-007","ch":16,"lvl":"S","q":"Index options traded in India are:","o":["American style","Never exercised","European style","Exercisable any day"],"a":2,"why":"Index (and stock) options in India are European.","x":["Not in India.","They are exercised at expiry if ITM (cash settled).",null,"That's American."]},{"id":"c16-008","ch":16,"lvl":"S","q":"The breakeven for a put option buyer is:","o":["Strike","Strike + premium","Strike − premium","Spot + premium"],"a":2,"why":"The price must fall below K by the premium.","x":["At K the put is worthless.","That's a call.",null,"Not a breakeven formula."]},{"id":"c16-009","ch":16,"lvl":"H","q":"You hold a long call on a stock that finishes ITM at expiry. Under physical settlement you:","o":["Receive cash only","Lose the premium and nothing else","Pay the strike price and receive the shares","Receive the strike price and deliver shares"],"a":2,"why":"Long call → right to buy at K.","x":["Stock options are physically settled.","ITM options are exercised.",null,"That's a short call."]},{"id":"c16-010","ch":16,"lvl":"H","q":"An option has theta of −5 per day. Other things equal, roughly how much value does it lose over 4 days?","o":["It gains ₹20","About ₹20","About ₹5","About ₹1.25"],"a":1,"why":"Theta × days = −5 × 4 = −20.","x":["Negative theta means a loss in value.",null,"That's one day.","You divided by days."]},{"id":"c16-011","ch":16,"lvl":"S","q":"Theta measures:","o":["Sensitivity to interest rates","Sensitivity to spot price","The fall in option value as time passes","Sensitivity to volatility"],"a":2,"why":"Time decay. Negative for buyers, positive for sellers.","x":["That's rho.","That's delta.",null,"That's vega."]},{"id":"c16-012","ch":16,"lvl":"S","q":"If the spot price rises (other things equal), the put premium:","o":["Falls","Stays the same","Rises","Becomes negative"],"a":0,"why":"A put gains from falling prices; a rise hurts it.","x":[null,"Spot is a key input.","That's a call.","Premiums can't be negative."]},{"id":"c16-013","ch":16,"lvl":"S","q":"Option premium is made up of:","o":["Intrinsic value − time value","Margin + brokerage","Strike price + spot price","Intrinsic value + time value"],"a":3,"why":"Premium = IV + TV.","x":["Time value is added.","No.","No.",null]},{"id":"c16-014","ch":16,"lvl":"H","q":"You hold 10 lots of Nifty calls (lot 75), each with delta 0.5. How many lots of Nifty futures should you sell to be delta-neutral?","o":["5 lots","10 lots","20 lots","Buy 5 lots"],"a":0,"why":"Delta exposure = 10 × 75 × 0.5 = 375 units = 5 lots. Futures delta = 1.","x":[null,"That assumes delta = 1.","You divided by delta.","Long calls have positive delta; you need to sell futures."]},{"id":"c16-015","ch":16,"lvl":"H","q":"A large dividend is expected before expiry. Effect on option premiums?","o":["Both rise","Call rises, put falls","No effect","Call premium falls, put premium rises"],"a":3,"why":"The share price drops by the dividend on ex-date, which hurts calls and helps puts.","x":["Dividends hurt calls.","Opposite.","Dividends lower the expected price.",null]},{"id":"c16-016","ch":16,"lvl":"S","q":"Put-call parity relates:","o":["Call price, put price, spot price and present value of strike","Volume and open interest","Strike and margin","Only call and put prices"],"a":0,"why":"C + PV(K) = P + S for European options.","x":[null,"No.","Margin is not in parity.","S and PV(K) are needed too."]},{"id":"c16-017","ch":16,"lvl":"S","q":"The delta of a call option lies between:","o":["−1 and +1","−1 and 0","1 and 2","0 and +1"],"a":3,"why":"Call value rises with spot; at most one-for-one.","x":["Too wide for a call alone.","That's a put.","Delta of a single call can't exceed 1.",null]},{"id":"c16-018","ch":16,"lvl":"S","q":"A call option gives its buyer the right to:","o":["Buy the underlying at the strike price","Sell the underlying at the strike price","Receive dividends","Buy at the market price on expiry"],"a":0,"why":"A call = right to buy.","x":[null,"That's a put.","Option holders don't get dividends.","The strike price, not the market price, is fixed."]},{"id":"c16-019","ch":16,"lvl":"H","q":"Long stock + long put (same quantity) has a payoff shape like:","o":["A short call","A long call","A long put","A short put"],"a":1,"why":"Downside is floored at the strike; upside open. That is a call's shape.","x":["Short call has capped upside, unlimited downside.",null,"Long put gains from falls only.","Short put has unlimited downside."]},{"id":"c16-020","ch":16,"lvl":"H","q":"Near expiry, what happens to the premium of an out-of-the-money option?","o":["It rises steadily","It decays quickly towards zero","It stays constant","It becomes equal to strike"],"a":1,"why":"Time value collapses fastest near expiry; OTM options have only time value.","x":["Theta works against it.",null,"Theta reduces it.","No."]},{"id":"c16-021","ch":16,"lvl":"S","q":"An at-the-money call has a delta of about:","o":["−0.5","1.0","0.5","0"],"a":2,"why":"ATM: roughly 50% chance of finishing ITM; delta ≈ 0.5.","x":["That's an ATM put.","That's deep ITM.",null,"That's deep OTM."]},{"id":"c16-022","ch":16,"lvl":"S","q":"In exchange-traded options, margin is paid by:","o":["The option buyer","No one","Both buyer and seller","The option seller"],"a":3,"why":"The buyer's risk is capped at the premium paid; the seller has open-ended risk.","x":["Buyer pays premium, not margin.","Sellers must pay margin.","That's futures.",null]},{"id":"c16-023","ch":16,"lvl":"S","q":"For calls on the same stock and expiry, a higher strike price means:","o":["Zero premium","Lower call premium","Higher call premium","Same premium"],"a":1,"why":"A higher K is harder to reach, so the call is worth less.","x":["Not necessarily zero.",null,"Opposite. Higher K raises put premium.","Strike matters."]},{"id":"c16-024","ch":16,"lvl":"H","q":"You SELL a call (strike 1,500) at a premium of 40, lot size 400. On expiry the spot is 1,620. What is your profit or loss on one lot?","o":["Loss of ₹32,000","Gain of ₹16,000","Loss of ₹64,000","Loss of ₹48,000"],"a":0,"why":"Writer pays max(0, S − K) = 120 and keeps 40. Net per unit = −80. × 400 = −₹32,000.","x":[null,"You assumed the option lapses. It's ITM, so the writer pays out.","The premium was received, so it reduces the loss.","You forgot the premium received."]},{"id":"c16-025","ch":16,"lvl":"H","q":"A call option has a delta of 0.6. The spot rises by ₹10. Roughly how does the premium change?","o":["Rises by ₹17","Falls by ₹6","Rises by ₹10","Rises by ₹6"],"a":3,"why":"Change ≈ delta × spot change = 0.6 × 10 = +6.","x":["You divided by delta. Multiply.","Sign reversed. Call delta is positive; put delta negative.","That assumes delta = 1.",null]},{"id":"c16-026","ch":16,"lvl":"S","q":"At expiry, the time value of an option is:","o":["Zero","Equal to premium","Negative","At its highest"],"a":0,"why":"At expiry, only intrinsic value remains.","x":[null,"At expiry premium = intrinsic value.","Time value can't be negative for these options.","Time value is highest with more time left."]},{"id":"c16-027","ch":16,"lvl":"S","q":"Stock options in India are settled at expiry by:","o":["Physical delivery","The buyer's choice","Cash only","Delivery of index units"],"a":0,"why":"ITM stock options lead to delivery of shares.","x":[null,"No.","Index options are cash settled; stock options are physical.","No."]},{"id":"c16-028","ch":16,"lvl":"S","q":"An American option can be exercised:","o":["Only after expiry","Only in the USA","At any time up to and including expiry","Only on expiry"],"a":2,"why":"American = any time. European = only on expiry.","x":["Options expire worthless after expiry.","It's a style name.",null,"That's European."]},{"id":"c16-029","ch":16,"lvl":"H","q":"You SELL a call (strike 24,500) at a premium of 210, lot size 75. On expiry the spot is 24,900. What is your profit or loss on one lot?","o":["Gain of ₹15,750","Loss of ₹14,250","Loss of ₹30,000","Loss of ₹45,750"],"a":1,"why":"Writer pays max(0, S − K) = 400 and keeps 210. Net per unit = −190. × 75 = −₹14,250.","x":["You assumed the option lapses. It's ITM, so the writer pays out.",null,"You forgot the premium received.","The premium was received, so it reduces the loss."]},{"id":"c16-030","ch":16,"lvl":"H","q":"Which option has the highest time value, other things equal?","o":["An expired option","An at-the-money option","A deep in-the-money option","A deep out-of-the-money option"],"a":1,"why":"Uncertainty of finishing ITM is greatest at the strike.","x":["Time value is zero at expiry.",null,"Mostly intrinsic value.","Small chance of value; small time value."]},{"id":"c16-031","ch":16,"lvl":"S","q":"You buy a put with strike 24,000 at a premium of 150. On expiry the spot is 24,100. What is your profit or loss per unit?","o":["+150","-150","-250","0"],"a":1,"why":"Payoff = max(0, 24,000 − 24,100) = 0. Profit = 0 − 150 = -150.","x":["Sign reversed.",null,"A put buyer's loss is capped at the premium.","The put lapses, but the premium you paid is lost."]},{"id":"c16-032","ch":16,"lvl":"S","q":"Spot is ₹520. A put with strike ₹500 trades at ₹6. What are its intrinsic value and time value?","o":["IV ₹0, TV ₹6","IV ₹20, TV ₹-14","IV ₹6, TV ₹0","IV ₹6, TV ₹20"],"a":0,"why":"IV = max(0, K − S) = 0. TV = premium − IV = 6 − 0 = 6.","x":[null,"For a put, IV = K − S; here that's negative, so IV = 0.","You swapped the two.","IV comes from S and K, not the premium."]},{"id":"c16-033","ch":16,"lvl":"S","q":"Rho measures sensitivity of option value to:","o":["Interest rates","Volatility","Dividends","Delta"],"a":0,"why":"Rho is positive for calls, negative for puts.","x":[null,"That's vega.","No standard Greek for this here.","That's gamma."]},{"id":"c16-034","ch":16,"lvl":"H","q":"You sell a put (strike 1,000) for ₹25. On expiry the stock is at ₹1,060. Your result per share?","o":["Profit of ₹25","Profit of ₹85","Loss of ₹35","Profit of ₹60"],"a":0,"why":"The put expires OTM (S > K), so it lapses and you keep the premium.","x":[null,"The premium is the only income.","The put is OTM; no payout.","The writer's profit is capped at the premium."]},{"id":"c16-035","ch":16,"lvl":"H","q":"Which Greek is the same for a call and a put with the same strike and expiry?","o":["Intrinsic value","Gamma","Rho","Delta"],"a":1,"why":"Call and put deltas differ by 1 (from parity), so their rate of change (gamma) is the same. Vega is also the same.","x":["Depends on S vs K.",null,"Call rho positive, put rho negative.","Call delta is positive, put delta negative."]},{"id":"c16-036","ch":16,"lvl":"S","q":"Spot is ₹520. A call with strike ₹500 trades at ₹32. What are its intrinsic value and time value?","o":["IV ₹20, TV ₹12","IV ₹32, TV ₹0","IV ₹32, TV ₹20","IV ₹12, TV ₹20"],"a":0,"why":"IV = max(0, S − K) = 20. TV = premium − IV = 32 − 20 = 12.","x":[null,"Premium isn't all intrinsic value; some is time value.","IV comes from S and K, not the premium.","You swapped the two."]},{"id":"c16-037","ch":16,"lvl":"S","q":"An option buyer exercises the option when it is:","o":["At-the-money only","Out-of-the-money","Never","In-the-money"],"a":3,"why":"Exercise only makes sense when it gives a positive payoff.","x":["Payoff is zero at ATM.","Exercise would lose money.","ITM options are exercised.",null]},{"id":"c16-038","ch":16,"lvl":"S","q":"Vega measures the change in option premium for a change in:","o":["Interest rate","Time","Volatility","Spot price"],"a":2,"why":"Vega = premium change per 1% change in volatility.","x":["That's rho.","That's theta.",null,"That's delta."]},{"id":"c16-039","ch":16,"lvl":"H","q":"Spot is ₹1,050. A put has a strike of ₹1,100. This put is:","o":["Out-of-the-money by ₹50","At-the-money","Worthless","In-the-money by ₹50"],"a":3,"why":"Put is ITM when S < K: 1,100 − 1,050 = 50.","x":["For a put, S < K is ITM.","S ≠ K.","It has ₹50 intrinsic value.",null]},{"id":"c16-040","ch":16,"lvl":"H","q":"Implied volatility rises before company results. What happens to option premiums?","o":["Only calls rise","Both call and put premiums rise","Both fall","Only puts rise"],"a":1,"why":"Higher implied volatility raises all option prices.","x":["Puts also rise.",null,"Opposite.","Calls also rise."]},{"id":"c16-041","ch":16,"lvl":"S","q":"You buy a call with strike 500 at a premium of 18. On expiry the spot is 530. What is your profit or loss per unit?","o":["+48","+12","+30","-12"],"a":1,"why":"Payoff = max(0, 530 − 500) = 30. Profit = payoff − premium = +12.","x":["You added the premium. It's a cost — subtract it.",null,"That's the payoff before premium.","Sign reversed."]},{"id":"c16-042","ch":16,"lvl":"S","q":"The option writer:","o":["Receives the premium and takes on the obligation","Has the right to exercise","Pays the premium","Pays no margin"],"a":0,"why":"Writer = seller.","x":[null,"That's the buyer.","That's the buyer.","Writers pay margin."]},{"id":"c16-043","ch":16,"lvl":"S","q":"A put option is in-the-money when:","o":["Strike price is zero","Spot price = strike price","Spot price < strike price","Spot price > strike price"],"a":2,"why":"A put lets you sell at K when the market is lower.","x":["Not meaningful.","That's ATM.",null,"That's OTM for a put."]},{"id":"c16-044","ch":16,"lvl":"H","q":"Long call + short put, same strike and expiry, is equal to:","o":["A straddle","Cash","A short futures position","A long futures position (synthetic long)"],"a":3,"why":"From put-call parity: C − P = S − PV(K). Payoff is linear like futures.","x":["A straddle is long call + long put.","It moves with the market.","That's short call + long put.",null]},{"id":"c16-045","ch":16,"lvl":"H","q":"A deep in-the-money call option behaves most like:","o":["A long futures position (delta near 1)","Cash","A long put","A short put"],"a":0,"why":"Its value moves almost one-for-one with spot.","x":[null,"It still moves with the spot.","Opposite direction.","A short put has positive delta but different payoff."]},{"id":"c16-046","ch":16,"lvl":"S","q":"You buy a call with strike 25,000 at a premium of 180. On expiry the spot is 25,400. What is your profit or loss per unit?","o":["+400","-220","+580","+220"],"a":3,"why":"Payoff = max(0, 25,400 − 25,000) = 400. Profit = payoff − premium = +220.","x":["That's the payoff before premium.","Sign reversed.","You added the premium. It's a cost — subtract it.",null]},{"id":"c16-047","ch":16,"lvl":"S","q":"Which Black-Scholes input cannot be observed directly in the market?","o":["Strike price","Time to expiry","Spot price","Volatility"],"a":3,"why":"Spot, strike, time and rate are known. Volatility must be estimated (or implied).","x":["Set in the contract.","Known from the expiry date.","Observed on screen.",null]},{"id":"c16-048","ch":16,"lvl":"S","q":"You buy a put with strike 1,000 at a premium of 30. On expiry the spot is 940. What is your profit or loss per unit?","o":["+30","+60","+90","-30"],"a":0,"why":"Payoff = max(0, 1,000 − 940) = 60. Profit = 60 − 30 = +30.","x":[null,"That's the payoff before premium.","Premium is a cost. Subtract it.","Sign reversed."]},{"id":"c16-049","ch":16,"lvl":"H","q":"Interest rates rise (other things equal). Effect on option premiums?","o":["Call premium rises, put premium falls","Call falls, put rises","Both rise","Both fall"],"a":0,"why":"Higher rates cut the present value of the strike paid later — good for calls, bad for puts.","x":[null,"Opposite.","Puts fall.","Calls rise."]},{"id":"c16-050","ch":16,"lvl":"H","q":"Why must option sellers pay margin while buyers don't?","o":["Buyers are always retail","Sellers earn more money","Sellers face large or unlimited losses; buyers' loss is capped at the premium already paid","SEBI taxes sellers"],"a":2,"why":"The clearing corporation needs cover for the seller's open-ended risk.","x":["Buyer type doesn't matter.","Income isn't the reason.",null,"Margin isn't a tax."]},{"id":"c16-051","ch":16,"lvl":"S","q":"The maximum profit for a put option buyer is:","o":["Premium paid","Strike price − premium","Unlimited","Strike price + premium"],"a":1,"why":"The best case is the price going to zero: profit = K − 0 − premium.","x":["That's the max loss.",null,"A price can't fall below zero.","Premium is a cost, so subtract it."]},{"id":"c16-052","ch":16,"lvl":"S","q":"What is the breakeven price at expiry for the buyer of a call with strike 1,200 bought at a premium of 45?","o":["1,245","1,155","1,290","1,200"],"a":0,"why":"Call breakeven = K + premium = 1,245.","x":[null,"Wrong sign. Calls: K + P. Puts: K − P.","Premium counts once.","At the strike the option is worth zero; the premium is lost."]},{"id":"c16-053","ch":16,"lvl":"S","q":"You buy a call with strike 1,200 at a premium of 45. On expiry the spot is 1,180. What is your profit or loss per unit?","o":["-45","0","+45","-65"],"a":0,"why":"Payoff = max(0, 1,180 − 1,200) = 0. Profit = payoff − premium = -45.","x":[null,"The option lapses, but the premium you paid is lost.","Sign reversed.","A call buyer's loss is capped at the premium; the option just lapses."]},{"id":"c16-054","ch":16,"lvl":"H","q":"You bought a call (strike ₹500) for ₹20. On expiry the stock is at ₹510. What should you do, and what is your result per share?","o":["Exercise; profit of ₹30","Let it lapse; loss of ₹20","Exercise; profit of ₹10","Exercise; net loss of ₹10"],"a":3,"why":"Exercise recovers ₹10 of the ₹20 premium. Not exercising loses all ₹20.","x":["Premium is a cost.","Exercising gives ₹10 back. Always exercise if ITM, even below breakeven.","Payoff is ₹10, but you paid ₹20.",null]},{"id":"c16-055","ch":16,"lvl":"H","q":"European options, same strike and expiry. Call = ₹120, spot = ₹2400, present value of strike = ₹2350. By put-call parity, what is the put price?","o":["₹70","₹120","₹50","₹170"],"a":0,"why":"C + PV(K) = P + S → P = C + PV(K) − S = 120 + 2350 − 2400 = 70.","x":[null,"Put and call are equal only when S = PV(K).","You left out the call price.","Wrong rearrangement. P = C + PV(K) − S."]},{"id":"c16-056","ch":16,"lvl":"S","q":"An option is at-the-money when:","o":["Spot is far above strike","Spot price equals strike price","It has expired","Premium is zero"],"a":1,"why":"ATM: S = K, for both calls and puts.","x":["Deep ITM call / deep OTM put.",null,"Expiry is unrelated to moneyness.","Premium of ATM options is all time value, not zero."]},{"id":"c16-057","ch":16,"lvl":"S","q":"The maximum loss for a call option buyer is:","o":["Strike minus premium","Strike price","The premium paid","Unlimited"],"a":2,"why":"The buyer can let the option lapse; loss is capped at premium.","x":["That's a put seller's max loss.","The buyer never loses the strike.",null,"That's the call seller."]},{"id":"c16-058","ch":16,"lvl":"S","q":"Buying a put option expresses a view that is:","o":["Bullish","Bearish","Neutral","Volatility-neutral"],"a":1,"why":"A long put gains when the price falls.","x":["That's a long call.",null,"That's selling options.","Long options gain from higher volatility."]},{"id":"c16-059","ch":16,"lvl":"H","q":"An option has vega of 8 (per 1% volatility). Implied volatility rises from 14% to 17%. Roughly how does the premium change?","o":["Rises by ₹8","Rises by ₹136","Rises by about ₹24","Falls by ₹24"],"a":2,"why":"Vega × change in vol = 8 × 3 = 24.","x":["That's for a 1% change.","You multiplied by the full 17%.",null,"Higher volatility raises premium."]},{"id":"c16-060","ch":16,"lvl":"H","q":"Compare an American and a European option with the same terms:","o":["The American option is worth at least as much","They are always equal","The European is always worth more","The American is always worth double"],"a":0,"why":"It has every right the European has, plus early exercise.","x":[null,"They can differ (e.g. puts, dividends).","Fewer rights can't be worth more.","No."]},{"id":"c16-061","ch":16,"lvl":"S","q":"The delta of a put option lies between:","o":["0 and +1","1 and 2","−1 and 0","Always exactly −0.5"],"a":2,"why":"Put value falls as spot rises.","x":["That's a call.","No.",null,"Only around ATM."]},{"id":"c16-062","ch":16,"lvl":"S","q":"A call option is in-the-money when:","o":["Spot price = strike price","Spot price > strike price","Spot price < strike price","Premium > strike price"],"a":1,"why":"Exercising a call at K when S > K gives S − K.","x":["That's ATM.",null,"That's OTM for a call (ITM for a put).","Moneyness compares S and K."]},{"id":"c16-063","ch":16,"lvl":"S","q":"The breakeven for a call option buyer is:","o":["Strike","Strike + premium","Strike − premium","Premium only"],"a":1,"why":"The price must rise above K by the premium to recover it.","x":["At K the option is worth zero; premium is lost.",null,"That's a put.","Breakeven is a price level."]},{"id":"c16-064","ch":16,"lvl":"H","q":"European options, same strike and expiry. Call = ₹50, spot = ₹1000, present value of strike = ₹980. By put-call parity, what is the put price?","o":["₹30","₹20","₹70","₹50"],"a":0,"why":"C + PV(K) = P + S → P = C + PV(K) − S = 50 + 980 − 1000 = 30.","x":[null,"You left out the call price.","Wrong rearrangement. P = C + PV(K) − S.","Put and call are equal only when S = PV(K)."]},{"id":"c16-065","ch":16,"lvl":"S","q":"A European option can be exercised:","o":["At any time up to expiry","Only on the expiry date","Only before expiry","Only in Europe"],"a":1,"why":"European = expiry only. American = any time up to expiry.","x":["That's American.",null,"Exercise is allowed on expiry.","It's a style name, not a place."]},{"id":"c16-066","ch":16,"lvl":"S","q":"What is the breakeven price at expiry for the buyer of a put with strike 24,000 bought at a premium of 150?","o":["24,000","24,150","23,850","23,700"],"a":2,"why":"Put breakeven = K − premium = 23,850.","x":["At the strike the option is worth zero; the premium is lost.","Wrong sign. Calls: K + P. Puts: K − P.",null,"Premium counts once."]},{"id":"c16-067","ch":16,"lvl":"S","q":"The maximum loss for a call option seller (writer) is:","o":["Strike price","Unlimited","The premium received","Strike minus premium"],"a":1,"why":"If the price keeps rising, the call writer keeps losing.","x":["No cap at the strike.",null,"That's the max profit.","That's for a put writer."]},{"id":"c16-068","ch":16,"lvl":"S","q":"A put option gives its buyer the right to:","o":["Sell the underlying at the strike price","Receive the premium","Buy the underlying at the strike price","Vote at company meetings"],"a":0,"why":"A put = right to sell.","x":[null,"The seller receives the premium.","That's a call.","Options carry no voting rights."]},{"id":"c13-001","ch":13,"lvl":"S","q":"The notional value of a futures position equals:","o":["Margin paid","Futures price × lot size × number of lots","Premium × lot size","Spot price ÷ lot size"],"a":1,"why":"Notional value = the full value of the underlying the contract controls.","x":["Margin is only a fraction of notional value.",null,"Premium applies to options, and it isn't the notional value.","Dividing by lot size makes no sense here."]},{"id":"c13-002","ch":13,"lvl":"S","q":"The main difference between a forward and a futures contract is that a futures contract is:","o":["Standardised and traded on an exchange","Always settled by delivery","Free of any margin requirement","Customised to the needs of the two parties"],"a":0,"why":"Futures: standard terms, exchange-traded, daily MTM, clearing corporation guarantee. Forwards: custom, OTC.","x":[null,"Many futures (e.g. index futures) are cash settled.","Futures need initial margin and daily MTM.","That describes a forward."]},{"id":"c13-003","ch":13,"lvl":"S","q":"In a cash-settled derivative:","o":["The underlying is always delivered","No settlement happens at expiry","Only the price difference is paid; the underlying is not delivered","The buyer pays the full contract value"],"a":2,"why":"Index futures and index options in India are cash settled — an index can't be delivered.","x":["That is physical settlement.","Cash settlement happens at expiry.",null,"Only the difference changes hands."]},{"id":"c13-004","ch":13,"lvl":"H","q":"Which statement is TRUE?","o":["In futures only the buyer has an obligation","In futures both parties have obligations; in options only the seller has an obligation","Option buyers must pay margin daily","In options both parties have obligations"],"a":1,"why":"Futures: both must perform. Options: buyer has the right, seller has the obligation.","x":["Both buyer and seller of futures are obliged.",null,"Option buyers pay the full premium upfront; sellers pay margin.","The option buyer only has a right."]},{"id":"c13-005","ch":13,"lvl":"H","q":"A futures contract has a value of ₹16,00,000 and the margin is 12.5%. The price moves -2%. What is the return on the margin money?","o":["-1.6%","-25.0%","-2.0%","-16.0%"],"a":3,"why":"Margin = ₹2,00,000. P&L = -2% × ₹16,00,000 = −₹32,000. Return = P&L ÷ margin = -16.0%. Leverage = 100 ÷ 12.5 = 8.0×.","x":["Wrong scaling. Return = price move ÷ margin rate.","You multiplied by the margin rate. Divide by it instead.","That is the price move. You paid only the margin, so your return is magnified.",null]},{"id":"c13-006","ch":13,"lvl":"S","q":"SPAN is a system used to calculate:","o":["Daily mark-to-market profit and loss","Initial margin","Option premium","Securities transaction tax"],"a":1,"why":"SPAN estimates the worst likely one-day loss of a portfolio under many price and volatility scenarios. That sets initial margin.","x":["MTM is just today's settlement price minus yesterday's. No SPAN needed.",null,"Premium comes from the market (or a pricing model like Black-Scholes).","STT is a fixed rate set by law."]},{"id":"c13-007","ch":13,"lvl":"S","q":"The J.R. Varma Committee is mainly linked with:","o":["Launch of mutual funds in India","Taxation of derivatives","The overall framework for derivatives trading","Risk containment measures such as margins for derivatives"],"a":3,"why":"Varma recommended the margin and risk-containment system for exchange-traded derivatives.","x":["Unrelated. Mutual funds are under SEBI (MF) Regulations, 1996.","Tax is set by the Income Tax Act, not this committee.","That was the L.C. Gupta Committee.",null]},{"id":"c13-008","ch":13,"lvl":"S","q":"Exchange-traded equity derivatives in India are regulated by:","o":["AMFI","RBI","Ministry of Corporate Affairs","SEBI"],"a":3,"why":"SEBI regulates the securities markets, including equity derivatives on NSE/BSE.","x":["AMFI is the mutual fund industry body.","RBI regulates OTC interest rate and currency derivatives, not exchange equity derivatives.","MCA administers company law.",null]},{"id":"c13-009","ch":13,"lvl":"H","q":"Day 1 MTM is a loss of ₹40,000 and Day 2 MTM is a gain of ₹15,000 on the same futures position. What is the net cash outflow over two days?","o":["₹55,000","₹15,000","₹40,000","₹25,000"],"a":3,"why":"Cash flows: −40,000 + 15,000 = −25,000.","x":["You added the gain as a loss.","That is only Day 2.","You ignored the Day 2 gain.",null]},{"id":"c13-010","ch":13,"lvl":"H","q":"An option buyer pays ₹12,000 premium for one lot. The underlying moves sharply against the position. What is the most the buyer can lose?","o":["₹12,000","Unlimited","₹12,000 plus daily MTM losses","The full contract value"],"a":0,"why":"An option buyer's loss is capped at the premium paid. No margin calls.","x":[null,"That's an option seller (for calls).","Option buyers have no MTM; the premium is paid in full upfront.","The buyer only risks the premium."]},{"id":"c13-011","ch":13,"lvl":"S","q":"Which of these is NOT an economic function of derivatives markets?","o":["Improving liquidity in the underlying market","Price discovery","Guaranteeing returns to investors","Transfer of risk"],"a":2,"why":"Derivatives help price discovery, risk transfer and liquidity. Nothing guarantees returns.","x":["Derivatives draw more participants: a real function.","Futures prices reflect expected prices: a real function.",null,"Hedgers pass risk to speculators: a real function."]},{"id":"c13-012","ch":13,"lvl":"S","q":"A derivative is a contract whose value depends on:","o":["The face value printed on the contract","Its own demand and supply only","The credit rating of the exchange","The value of an underlying asset, index or rate"],"a":3,"why":"By definition a derivative 'derives' its value from an underlying: a share, index, commodity, currency or interest rate.","x":["Derivatives have a notional value; no printed face value sets their price.","Trading moves the price around, but without the underlying the contract has no value.","The exchange's rating has no link to a contract's value.",null]},{"id":"c13-013","ch":13,"lvl":"S","q":"The buyer of an option has:","o":["Neither a right nor an obligation","Both a right and an obligation","An obligation but no right","A right but not an obligation"],"a":3,"why":"The buyer pays the premium and can choose to exercise. The seller has the obligation.","x":["The buyer paid a premium for the right.","Both obligations exist in futures, not for an option buyer.","That describes the option seller (writer).",null]},{"id":"c13-014","ch":13,"lvl":"H","q":"A futures contract has a value of ₹20,00,000 and the margin is 15%. The price moves +3%. What is the return on the margin money?","o":["+3.0%","+20.0%","+45.0%","+2.0%"],"a":1,"why":"Margin = ₹3,00,000. P&L = +3% × ₹20,00,000 = ₹60,000. Return = P&L ÷ margin = +20.0%. Leverage = 100 ÷ 15 = 6.7×.","x":["That is the price move. You paid only the margin, so your return is magnified.",null,"You multiplied by the margin rate. Divide by it instead.","Wrong scaling. Return = price move ÷ margin rate."]},{"id":"c13-015","ch":13,"lvl":"H","q":"An index futures contract trades at 51,200 with a lot size of 30. What is the notional value of one lot?","o":["₹1,53,60,000","₹1,53,600","₹15,36,000","₹51,200"],"a":2,"why":"Notional = price × lot = 51,200 × 30 = ₹15,36,000.","x":["Off by a factor of 10. Check your multiplication.","Off by a factor of 10. Check your multiplication.",null,"That is just the index level, not the value of one lot."]},{"id":"c13-016","ch":13,"lvl":"S","q":"The underlying of a derivative can be:","o":["All of these: shares, indices, commodities, currencies and interest rates","Only commodities","Only equity shares","Only stock indices"],"a":0,"why":"Any asset or rate with a measurable price can be an underlying.","x":[null,"Too narrow.","Too narrow.","Too narrow."]},{"id":"c13-017","ch":13,"lvl":"S","q":"OTC interest rate derivatives in India are regulated by:","o":["PFRDA","RBI","SEBI","IRDAI"],"a":1,"why":"RBI regulates OTC interest rate derivatives such as IRS and FRA.","x":["PFRDA regulates pensions.",null,"SEBI regulates exchange-traded products. OTC rate derivatives are RBI's.","IRDAI regulates insurance."]},{"id":"c13-018","ch":13,"lvl":"S","q":"Compared with OTC derivatives, exchange-traded derivatives have:","o":["No margin requirement","Higher counterparty risk","Customised terms","Higher transparency and liquidity"],"a":3,"why":"Prices and volumes are public, and standard contracts attract many traders.","x":["Exchange-traded products always require margins.","Lower: the clearing corporation guarantees.","Customisation is an OTC feature.",null]},{"id":"c13-019","ch":13,"lvl":"H","q":"A futures contract has a value of ₹25,00,000 and the margin is 12%. The price moves +4%. What is the return on the margin money?","o":["+33.3%","+48.0%","+3.3%","+4.0%"],"a":0,"why":"Margin = ₹3,00,000. P&L = +4% × ₹25,00,000 = ₹1,00,000. Return = P&L ÷ margin = +33.3%. Leverage = 100 ÷ 12 = 8.3×.","x":[null,"You multiplied by the margin rate. Divide by it instead.","Wrong scaling. Return = price move ÷ margin rate.","That is the price move. You paid only the margin, so your return is magnified."]},{"id":"c13-020","ch":13,"lvl":"H","q":"An investor fully hedges a share portfolio with futures. What does the hedge do?","o":["Doubles the exposure","Removes only the downside","Removes both the downside and the upside","Removes only the upside"],"a":2,"why":"A futures hedge locks the value: losses and gains on shares are offset by the futures.","x":["An opposite position reduces, not doubles, exposure.","Only an options hedge (protective put) keeps the upside.",null,"It removes both."]},{"id":"c13-021","ch":13,"lvl":"S","q":"Which was the first exchange-traded derivative product in India?","o":["Stock options","Stock futures","Index futures (June 2000)","Index options"],"a":2,"why":"Sequence: index futures Jun 2000 → index options Jun 2001 → stock options Jul 2001 → stock futures Nov 2001.","x":["Stock options started in July 2001.","Stock futures came last, in Nov 2001.",null,"Index options started in June 2001, one year after index futures."]},{"id":"c13-022","ch":13,"lvl":"S","q":"In an option contract, the premium is paid by:","o":["The option buyer to the option seller","Both parties to the exchange","The clearing corporation","The option seller to the buyer"],"a":0,"why":"The buyer pays the premium for the right. The seller receives it for taking the obligation.","x":[null,"The exchange charges fees, but the premium goes buyer → seller.","The clearing corporation guarantees settlement; it doesn't pay premium.","Reversed. The seller receives the premium."]},{"id":"c13-023","ch":13,"lvl":"S","q":"The world's earliest organised futures exchange was:","o":["Chicago Board of Trade (1848)","Bombay Stock Exchange","NSE","London Stock Exchange"],"a":0,"why":"CBOT started organised grain futures trading in 1848.","x":[null,"BSE (1875) is the oldest in Asia, but not a futures pioneer.","NSE started in the 1990s.","LSE is a stock exchange, not the first futures exchange."]},{"id":"c13-024","ch":13,"lvl":"H","q":"The exchange raises the margin on index futures. What is the likely effect?","o":["Leverage rises","Option premiums double","Index futures stop trading","Leverage falls and speculative positions tend to shrink"],"a":3,"why":"High
